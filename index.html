<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>ddt and apple trees</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: white;
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* -------------------------
       HEADER
    ------------------------- */

    #header {
      position: fixed;
      z-index: 10000;
      top: 0;
      left: 0;
      width: 100%;
      height: 54px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 18px;

      background: rgba(255, 255, 255, 0.94);
      border-bottom: 1px solid #e5e5e5;
    }

    #siteTitle {
      font-size: 15px;
      letter-spacing: 0.02em;
      font-weight: 500;
      white-space: nowrap;
    }

    #categories {
      display: flex;
      gap: 6px;
      align-items: center;
      overflow-x: auto;
      scrollbar-width: none;
    }

    #categories::-webkit-scrollbar {
      display: none;
    }

    .category-btn {
      border: 0;
      background: transparent;
      padding: 6px 9px;
      font-size: 11px;
      letter-spacing: 0.06em;
      color: #777;
    }

    .category-btn:hover {
      color: #111;
    }

    .category-btn.active {
      color: #111;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    #adminOpen {
      border: 0;
      background: transparent;
      font-size: 11px;
      color: #999;
      padding: 6px;
      margin-left: 8px;
    }

    #adminOpen:hover {
      color: #111;
    }

    /* -------------------------
       CANVAS
    ------------------------- */

    #canvas {
      position: fixed;
      left: 0;
      top: 54px;
      right: 0;
      bottom: 0;

      overflow-x: hidden;
      overflow-y: auto;
      background: white;
    }

    #world {
      position: absolute;

      left: 0;
      top: 0;

      width: 100%;
      height: 1400px;
      min-height: 1400px;
    }

    /* -------------------------
       ITEMS
    ------------------------- */

    .item {
      position: absolute;

      touch-action: none;
      user-select: none;
      -webkit-user-select: none;

      transform-origin: center center;
    }

    .item-inner {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .item-text {
      width: 100%;
      height: 100%;

      white-space: pre-wrap;
      word-break: break-word;

      font-size: 17px;
      line-height: 1.45;

      color: #111;

      overflow: hidden;
    }

    .item-note {
      width: 100%;
      height: 100%;

      padding: 14px;

      background: #fafafa;
      border: 1px solid #ddd;

      font-size: 14px;
      line-height: 1.5;

      overflow: hidden;
    }

    .item-image {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: contain;

      pointer-events: auto;
    }

    .video-frame {
      width: 100%;
      height: 100%;

      border: 0;

      display: block;
    }

    /* visitor mode */
    .visitor-video {
      pointer-events: auto;
    }

    /* admin mode */
    body.admin-mode .item {
      cursor: move;
      outline: 1px dashed transparent;
    }

    body.admin-mode .item:hover {
      outline: 1px dashed #aaa;
    }

    body.admin-mode .item.selected {
      outline: 1px solid #111;
    }

    body.admin-mode .item.selected .resize-handle,
    body.admin-mode .item.selected .rotate-handle,
    body.admin-mode .item.selected .delete-button {
      display: block;
    }

    body.admin-mode .video-frame {
      pointer-events: none;
    }

    .resize-handle {
      display: none;

      position: absolute;

      width: 12px;
      height: 12px;

      right: -6px;
      bottom: -6px;

      background: white;
      border: 1px solid #111;

      cursor: nwse-resize;
      z-index: 20;
    }

    .rotate-handle {
      display: none;

      position: absolute;

      width: 12px;
      height: 12px;

      left: 50%;
      top: -28px;

      transform: translateX(-50%);

      border-radius: 50%;

      background: white;
      border: 1px solid #111;

      cursor: grab;
      z-index: 20;
    }

    .rotate-line {
      display: none;

      position: absolute;

      width: 1px;
      height: 18px;

      left: 50%;
      top: -18px;

      background: #111;

      z-index: 19;
    }

    body.admin-mode .item.selected .rotate-line {
      display: block;
    }

    .delete-button {
      display: none;

      position: absolute;

      top: -10px;
      right: -10px;

      width: 20px;
      height: 20px;

      padding: 0;

      border-radius: 50%;
      border: 1px solid #111;

      background: white;

      font-size: 12px;
      line-height: 18px;

      z-index: 30;
    }

    /* -------------------------
       ADMIN BAR
    ------------------------- */

    #adminBar {
      display: none;

      position: fixed;
      z-index: 11000;

      left: 50%;
      bottom: 18px;

      transform: translateX(-50%);

      padding: 7px 9px;

      background: rgba(255, 255, 255, 0.97);

      border: 1px solid #ccc;

      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);

      gap: 5px;
      align-items: center;
    }

    body.list-view-active #adminBar {
      display: none;
    }

    body.admin-mode #adminBar {
      display: flex;
    }

    .admin-btn {
      border: 0;
      background: white;

      padding: 7px 9px;

      font-size: 10px;
      letter-spacing: 0.04em;

      color: #333;
    }

    .admin-btn:hover {
      background: #f1f1f1;
    }

    .admin-separator {
      width: 1px;
      height: 18px;
      background: #ddd;
      margin: 0 3px;
    }

    #saveStatus {
      font-size: 10px;
      color: #777;
      margin: 0 5px;
      white-space: nowrap;
    }

    /* -------------------------
       LOGIN MODAL
    ------------------------- */

    #loginModal,
    #addModal {
      display: none;

      position: fixed;
      z-index: 20000;

      inset: 0;

      background: rgba(255, 255, 255, 0.75);

      align-items: center;
      justify-content: center;
    }

    #loginModal.show,
    #addModal.show {
      display: flex;
    }

    .modal-box {
      width: min(420px, calc(100vw - 36px));

      background: white;

      border: 1px solid #ccc;

      padding: 24px;

      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.12);
    }

    .modal-title {
      font-size: 14px;
      margin-bottom: 18px;
    }

    .modal-input,
    .modal-select,
    .modal-textarea {
      width: 100%;

      border: 1px solid #ccc;

      background: white;

      padding: 10px 11px;

      margin-bottom: 10px;

      outline: none;
    }

    .modal-input:focus,
    .modal-select:focus,
    .modal-textarea:focus {
      border-color: #111;
    }

    .modal-textarea {
      min-height: 130px;
      resize: vertical;
    }

    .modal-row {
      display: flex;
      gap: 8px;
    }

    .modal-row > * {
      flex: 1;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 7px;
      margin-top: 12px;
    }

    .modal-btn {
      padding: 8px 12px;

      border: 1px solid #ccc;

      background: white;

      font-size: 11px;
    }

    .modal-btn.primary {
      background: #111;
      color: white;
      border-color: #111;
    }

    .modal-error {
      display: none;
      color: #c00;
      font-size: 11px;
      margin-top: 8px;
    }

    /* -------------------------
       EMPTY MESSAGE
    ------------------------- */

    /* -------------------------
       CATEGORY / ARCHIVE VIEWS
    ------------------------- */

    #canvas.list-view {
      overflow-y: auto;
      overflow-x: hidden;
    }

    .category-grid {
      position: relative;
      width: 100%;
      min-height: 100%;
      padding: 34px 28px 120px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 34px 24px;
      align-content: start;
    }

    .category-card {
      position: relative;
      min-width: 0;
      background: white;
    }

    .category-card-media {
      width: 100%;
      aspect-ratio: 4 / 3;
      border: 1px solid #e5e5e5;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #fafafa;
    }

    .category-card img,
    .category-card iframe {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border: 0;
    }

    .category-card-text {
      padding-top: 9px;
      font-size: 12px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .category-card-meta {
      margin-top: 4px;
      font-size: 10px;
      color: #999;
      letter-spacing: .04em;
    }

    .archive-grid {
      position: relative;
      width: 100%;
      min-height: 100%;
      padding: 34px 28px 120px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 44px 28px;
      align-content: start;
    }

    .archive-card {
      cursor: pointer;
    }

    .archive-preview {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 10;
      overflow: hidden;
      background: white;
      border: 1px solid #e5e5e5;
    }

    .archive-preview-item {
      position: absolute;
      overflow: hidden;
      transform-origin: center center;
      pointer-events: none;
    }

    .archive-preview-item img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .archive-preview-text {
      width: 100%;
      height: 100%;
      white-space: pre-wrap;
      overflow: hidden;
      font-size: 9px;
      line-height: 1.35;
    }

    .archive-preview-note {
      width: 100%;
      height: 100%;
      padding: 5px;
      background: #fafafa;
      border: 1px solid #ddd;
      font-size: 8px;
      line-height: 1.35;
      overflow: hidden;
    }

    .archive-preview-video {
      width: 100%;
      height: 100%;
      background: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      color: #777;
    }

    .archive-title {
      padding-top: 10px;
      font-size: 12px;
    }

    .archive-date {
      padding-top: 4px;
      font-size: 10px;
      color: #999;
    }

    .archive-delete-button {
      display: none;
      margin-top: 8px;
      border: 1px solid #ddd;
      background: white;
      padding: 5px 7px;
      font-size: 9px;
      color: #999;
      letter-spacing: .04em;
    }

    .archive-delete-button:hover {
      color: #111;
      border-color: #111;
    }

    body.admin-mode .archive-delete-button {
      display: inline-block;
    }

    #archiveViewer {
      display: none;
      position: fixed;
      z-index: 9000;
      inset: 54px 0 0 0;
      background: white;
      overflow: hidden;
    }

    #archiveViewer.show {
      display: block;
    }

    #archiveViewerRestore {
      display: none;
      position: absolute;
      z-index: 20;
      top: 14px;
      left: 18px;
      border: 0;
      background: rgba(255,255,255,.9);
      font-size: 12px;
      padding: 7px 9px;
    }

    body.admin-mode #archiveViewerRestore {
      display: block;
    }

    #archiveViewerClose {
      position: absolute;
      z-index: 20;
      top: 14px;
      right: 18px;
      border: 0;
      background: rgba(255,255,255,.9);
      font-size: 12px;
      padding: 7px 9px;
    }

    #archiveViewerWorld {
      position: absolute;
      inset: 0;
    }

    #emptyMessage {
      position: absolute;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      color: #aaa;

      font-size: 12px;

      pointer-events: none;

      display: none;
    }

    /* -------------------------
       MOBILE
    ------------------------- */

    @media (max-width: 700px) {
      #header {
        height: auto;
        min-height: 54px;
        padding: 9px 12px;
        flex-wrap: wrap;
        gap: 3px;
      }

      #categories {
        order: 3;
        width: 100%;
        padding-bottom: 2px;
      }

      #canvas {
        top: 88px;
      }

      #world {
        height: 1600px;
        min-height: 1600px;
      }

      #adminBar {
        max-width: calc(100vw - 20px);
        overflow-x: auto;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header id="header">

    <div id="siteTitle">
      ddt and apple trees
    </div>

    <nav id="categories">

      <button class="category-btn active" data-category="all">
        ALL
      </button>

      <button class="category-btn" data-category="writing">
        WRITING
      </button>

      <button class="category-btn" data-category="sound">
        SOUND
      </button>

      <button class="category-btn" data-category="image">
        IMAGE
      </button>

      <button class="category-btn" data-category="video">
        VIDEO
      </button>

      <button class="category-btn" data-category="archive">
        ARCHIVE
      </button>

    </nav>

    <button id="adminOpen">
      ADMIN
    </button>

  </header>


  <!-- CANVAS -->
  <main id="canvas">
    <div id="world"></div>

    <div id="emptyMessage">
      nothing here yet
    </div>
  </main>


  <!-- ADMIN BAR -->
  <div id="adminBar">

    <button class="admin-btn" id="addText">
      + TEXT
    </button>

    <button class="admin-btn" id="addNote">
      + NOTE
    </button>

    <button class="admin-btn" id="addImage">
      + IMAGE
    </button>

    <button class="admin-btn" id="addVideo">
      + VIDEO
    </button>

    <div class="admin-separator"></div>

    <button class="admin-btn" id="saveAll">
      SAVE PAGE
    </button>

    <button class="admin-btn" id="logout">
      LOGOUT
    </button>

    <span id="saveStatus">
      ready
    </span>

  </div>


  <div id="archiveViewer">
    <button id="archiveViewerRestore">RESTORE TO MAIN</button>
    <button id="archiveViewerClose">CLOSE</button>
    <div id="archiveViewerWorld"></div>
  </div>


  <!-- LOGIN -->
  <div id="loginModal">

    <div class="modal-box">

      <div class="modal-title">
        administrator
      </div>

      <input
        id="emailInput"
        class="modal-input"
        type="email"
        placeholder="email"
        autocomplete="username"
      />

      <input
        id="passwordInput"
        class="modal-input"
        type="password"
        placeholder="password"
        autocomplete="current-password"
      />

      <div id="loginError" class="modal-error">
        email or password is incorrect
      </div>

      <div class="modal-actions">

        <button
          class="modal-btn"
          id="cancelLogin"
        >
          CANCEL
        </button>

        <button
          class="modal-btn primary"
          id="loginButton"
        >
          ENTER
        </button>

      </div>

    </div>

  </div>


  <!-- ADD ITEM -->
  <div id="addModal">

    <div class="modal-box">

      <div class="modal-title" id="addModalTitle">
        add item
      </div>

      <input
        id="itemTitle"
        class="modal-input"
        placeholder="title (optional)"
      />

      <select
        id="itemCategory"
        class="modal-select"
      >
        <option value="writing">WRITING</option>
        <option value="sound">SOUND</option>
        <option value="image">IMAGE</option>
        <option value="video">VIDEO</option>
      </select>

      <textarea
        id="itemContent"
        class="modal-textarea"
        placeholder=""
      ></textarea>

      <div class="modal-actions">

        <button
          class="modal-btn"
          id="cancelAdd"
        >
          CANCEL
        </button>

        <button
          class="modal-btn primary"
          id="createItem"
        >
          ADD
        </button>

      </div>

    </div>

  </div>


  <script>

    /* ============================================================
       SUPABASE
    ============================================================ */

    const SUPABASE_URL =
      "https://ocqfspslmfddxzqvdygi.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_ntO5tHSW-9G-yil3kLi3oQ_r8hwxyhI";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    /* ============================================================
       AUTHENTICATION
    ============================================================ */

    let currentSession = null;


    /* ============================================================
       STATE
    ============================================================ */

    let items = [];

    let activeCategory = "all";

    let adminMode = false;

    let selectedItemId = null;

    let addingType = null;

    let dragState = null;

    let resizeState = null;

    let rotateState = null;


    /* ============================================================
       ELEMENTS
    ============================================================ */

    const world =
      document.getElementById("world");

    const emptyMessage =
      document.getElementById("emptyMessage");

    const loginModal =
      document.getElementById("loginModal");

    const addModal =
      document.getElementById("addModal");

    const emailInput =
      document.getElementById("emailInput");

    const passwordInput =
      document.getElementById("passwordInput");

    const loginError =
      document.getElementById("loginError");

    const itemTitle =
      document.getElementById("itemTitle");

    const itemCategory =
      document.getElementById("itemCategory");

    const itemContent =
      document.getElementById("itemContent");

    const addModalTitle =
      document.getElementById("addModalTitle");

    const saveStatus =
      document.getElementById("saveStatus");


    /* ============================================================
       UTILS
    ============================================================ */

    function makeId() {
      return (
        Date.now().toString(36) +
        Math.random().toString(36).slice(2)
      );
    }


    function escapeText(value) {
      return String(value ?? "");
    }


    function youtubeId(url) {

      if (!url) return null;

      try {

        const parsed =
          new URL(url.trim());

        if (
          parsed.hostname.includes("youtube.com")
        ) {

          if (
            parsed.pathname === "/watch"
          ) {
            return parsed.searchParams.get("v");
          }

          if (
            parsed.pathname.startsWith("/shorts/")
          ) {
            return parsed.pathname
              .split("/")[2];
          }

          if (
            parsed.pathname.startsWith("/embed/")
          ) {
            return parsed.pathname
              .split("/")[2];
          }
        }

        if (
          parsed.hostname === "youtu.be"
        ) {
          return parsed.pathname
            .slice(1)
            .split("?")[0];
        }

      } catch (error) {
        return null;
      }

      return null;
    }


    function categoryForType(type) {

      if (type === "text") {
        return "writing";
      }

      if (type === "note") {
        return "sound";
      }

      if (type === "image") {
        return "image";
      }

      if (type === "video") {
        return "video";
      }

      return "writing";
    }


    function defaultSize(type) {

      if (type === "image") {
        return {
          width: 360,
          height: 260
        };
      }

      if (type === "video") {
        return {
          width: 480,
          height: 300
        };
      }

      if (type === "note") {
        return {
          width: 280,
          height: 180
        };
      }

      return {
        width: 280,
        height: 150
      };
    }


    function setStatus(text) {
      saveStatus.textContent = text;
    }


    /* ============================================================
       LOAD
    ============================================================ */

    async function loadItems() {

      setStatus("loading...");

      const { data, error } = await supabaseClient
        .from("canvas_items")
        .select("*")
        .order("z_index", { ascending: true });

      if (error) {
        console.error(error);
        setStatus("database error");
        alert("Supabase에서 작품을 불러오지 못했습니다.\n\n" + error.message);
        return;
      }

      items = (data || [])
        .filter(item => item.type !== "archive_page")
        .map(item => ({
          id: item.id,
          type: item.type,
          content: item.content || "",
          title: item.title || "",
          category: ["archive", "theater"].includes(item.category)
            ? "writing"
            : (item.category || categoryForType(item.type)),
          x: Number(item.x ?? 0),
          y: Number(item.y ?? 0),
          width: Number(item.width ?? 200),
          height: Number(item.height ?? 150),
          z_index: Number(item.z_index ?? 1),
          rotation: Number(item.rotation ?? 0)
        }));

      await loadArchives();
      render();
      setStatus("ready");
    }


    async function loadArchives() {

      const { data, error } = await supabaseClient
        .from("canvas_items")
        .select("id, type, content, title, created_at")
        .eq("type", "archive_page")
        .order("created_at", { ascending: false });

      if (error) {
        console.error(error);
        archives = [];
        return;
      }

      archives = (data || []).map(row => {
        let snapshot = [];
        try {
          snapshot = JSON.parse(row.content || "[]");
        } catch (e) {
          snapshot = [];
        }
        return {
          id: row.id,
          title: row.title || "page",
          created_at: row.created_at,
          items: Array.isArray(snapshot) ? snapshot : []
        };
      });
    }


    /* ============================================================
       RENDER
    ============================================================ */

    function render() {

      world.innerHTML = "";
      canvas.classList.remove("list-view");
      document.body.classList.toggle("list-view-active", activeCategory !== "all");

      if (activeCategory === "archive") {
        canvas.classList.add("list-view");
        renderArchiveList();
        emptyMessage.style.display = "none";
        return;
      }

      if (activeCategory !== "all") {
        canvas.classList.add("list-view");
        renderCategoryList();
        return;
      }

      const visibleItems = items;

      emptyMessage.style.display = visibleItems.length === 0 ? "block" : "none";

      visibleItems.forEach(item => {
        world.appendChild(createItemElement(item));
      });
    }


    function renderCategoryList() {

      const grid = document.createElement("div");
      grid.className = "category-grid";

      const visibleItems = items.filter(item => item.category === activeCategory);
      emptyMessage.style.display = visibleItems.length === 0 ? "block" : "none";

      visibleItems.forEach(item => {
        const card = document.createElement("div");
        card.className = "category-card";

        const media = document.createElement("div");
        media.className = "category-card-media";

        if (item.type === "image") {
          const img = document.createElement("img");
          img.src = item.content;
          img.alt = item.title || "image";
          media.appendChild(img);

            t.textContent = item.content;
            el.appendChild(t);

            const t = document.createElement("div");
            t.className = "archive-preview-video";

    let openedArchivePage = null;

    async function deleteArchivePage(pageId) {
      if (!adminMode || !pageId) return;

      const page = archives.find(p => p.id === pageId);
      const title = page?.title || "this archived page";
      const ok = confirm(`"${title}" 아카이브를 삭제할까요?\n\n삭제하면 복구할 수 없습니다.`);
      if (!ok) return;

      setStatus("deleting archive...");

      const { error } = await supabaseClient
        .from("canvas_items")
        .delete()
        .eq("id", pageId);

      if (error) {
        console.error(error);
        alert("아카이브를 삭제하지 못했습니다.\n\n" + error.message);
        setStatus("delete failed");
        return;
      }

      archives = archives.filter(p => p.id !== pageId);

      if (openedArchivePage?.id === pageId) {
        openedArchivePage = null;
        document.getElementById("archiveViewer").classList.remove("show");
      }

      render();
      setStatus("archive deleted");
    }

        el.style.width = `${Number(item.width || 200)}px`;
        el.style.height = `${Number(item.height || 150)}px`;

      setStatus("restoring page...");

      if (hasCurrentItems) {

        width: Math.round(Number(item.width || 200)),

      el.appendChild(inner);


      /* ADMIN CONTROLS */

      rotateLine.className =
        "rotate-line";

      const rotate =
        document.createElement("div");

      rotate.className =

      /* EVENTS */

      el.addEventListener(
        "pointerdown",
        event => {

          if (!adminMode) {

          if (
            event.target === resize ||
            event.target === rotate ||
            event.target === deleteButton
          ) {
            return;
          }

          selectItem(item.id);

          startDrag(
            event,
            item,
            el
          );
        }
      );


      resize.addEventListener(
        "pointerdown",
        event => {

          if (!adminMode) {
            return;
          }

          event.stopPropagation();

          selectItem(item.id);

          startResize(
            event,
            item
          );
        }
      );


      rotate.addEventListener(
        "pointerdown",
        event => {

            return;
          }

          startRotate(
            event,

            el

        }
      );


      deleteButton.addEventListener(
        "click",
        async event => {

          event.stopPropagation();

    }


    /* ============================================================
       SELECT
    ============================================================ */

    function selectItem(id) {

      selectedItemId = id;

      // Do not re-render the whole canvas here.
      // Re-rendering during pointerdown detaches the element that is
      // about to receive pointer capture, which breaks dragging.
      document.querySelectorAll(".item.selected").forEach(el => {
        el.classList.remove("selected");
      });

      const selected =
        document.querySelector(`.item[data-id="${CSS.escape(id)}"]`);

      if (selected) {
        selected.classList.add("selected");
      }
    }


    /* ============================================================
       DRAG
    ============================================================ */

    function startDrag(
      event,
      item,
      element
    ) {

      event.preventDefault();

      element.setPointerCapture(
        event.pointerId
      );

      dragState = {

        id: item.id,

        pointerId:
          event.pointerId,

        startX:
          event.clientX,

        startY:
          event.clientY,

        originalX:
          item.x,

        originalY:
          item.y,

        element
      };

      element.addEventListener(
        "pointermove",
        handleDrag
      );

      element.addEventListener(
        "pointerup",
        stopDrag,
        {
          once: true
        }
      );
    }


    function handleDrag(event) {

      if (!dragState) {
        return;
      }

      const item =
        items.find(
          i =>
            i.id === dragState.id
        );

      if (!item) {
        return;
      }

      const dx =
        event.clientX -
        dragState.startX;

      const dy =
        event.clientY -
        dragState.startY;

      item.x =
        dragState.originalX + dx;

      item.y =
        dragState.originalY + dy;

      dragState.element.style.left =
        `${item.x}px`;

      dragState.element.style.top =
        `${item.y}px`;
    }


    function stopDrag(event) {

      if (!dragState) {
        return;
      }

      const element =
        dragState.element;

      element.removeEventListener(
        "pointermove",
        handleDrag
      );

      dragState = null;
    }


    /* ============================================================
       RESIZE
    ============================================================ */

    function startResize(
      event,
      item
    ) {

      event.preventDefault();

      resizeState = {

        id: item.id,

        startX:
          event.clientX,

        startY:
          event.clientY,

        originalWidth:
          item.width,

        originalHeight:
          item.height
      };

      window.addEventListener(
        "pointermove",
        handleResize
      );

      window.addEventListener(
        "pointerup",
        stopResize,
        {
          once: true
        }
      );
    }


    function handleResize(event) {

      if (!resizeState) {
        return;
      }

      const item =
        items.find(
          i =>
            i.id === resizeState.id
        );

      if (!item) {
        return;
      }

      const dx =
        event.clientX -
        resizeState.startX;

      const dy =
        event.clientY -
        resizeState.startY;

      item.width =
        Math.max(
          50,
          resizeState.originalWidth + dx
        );

      item.height =
        Math.max(
          40,
          resizeState.originalHeight + dy
        );

      render();
    }


    function stopResize() {

      window.removeEventListener(
        "pointermove",
        handleResize
      );

      resizeState = null;
    }


    /* ============================================================
       ROTATE
    ============================================================ */

    function startRotate(
      event,
      item,
      element
    ) {

      event.preventDefault();

      const rect =
        element.getBoundingClientRect();

      const centerX =
        rect.left +
        rect.width / 2;

      const centerY =
        rect.top +
        rect.height / 2;

      const startAngle =
        Math.atan2(
          event.clientY - centerY,
          event.clientX - centerX
        ) *
        180 /
        Math.PI;

      rotateState = {

        id: item.id,

        centerX,
        centerY,

        startAngle,

        originalRotation:
          item.rotation || 0
      };

      window.addEventListener(
        "pointermove",
        handleRotate
      );

      window.addEventListener(
        "pointerup",
        stopRotate,
        {
          once: true
        }
      );
    }


    function handleRotate(event) {

      if (!rotateState) {
        return;
      }

      const item =
        items.find(
          i =>
            i.id === rotateState.id
        );

      if (!item) {
        return;
      }

      const currentAngle =
        Math.atan2(
          event.clientY -
            rotateState.centerY,

          event.clientX -
            rotateState.centerX
        ) *
        180 /
        Math.PI;

      const difference =
        currentAngle -
        rotateState.startAngle;

      item.rotation =
        rotateState.originalRotation +
        difference;

      render();
    }


    function stopRotate() {

      window.removeEventListener(
        "pointermove",
        handleRotate
      );

      rotateState = null;
    }

    async function createNewItem() {

      if (!addingType) {
        return;
      }

      const content =
        itemContent.value.trim();

      if (!content) {

        alert(
          "내용을 입력해주세요."
        );

        return;
      }

      if (
        addingType === "image"
      ) {

        if (!content.startsWith("http")) {

          alert(
            "이미지 주소(URL)를 넣어주세요."
          );

          return;
        }
      }

      if (
        addingType === "video"
      ) {

        if (!youtubeId(content)) {

          alert(
            "YouTube 주소를 넣어주세요."
          );

          return;
        }
      }

      const size =
        defaultSize(addingType);

      const newItem = {

        id: makeId(),

        type: addingType,

        content,

        title:
          itemTitle.value.trim(),

        category:
          itemCategory.value,

        x:
          Math.max(
            30,
            Math.round(
              Math.random() *
              Math.max(
                100,
                window.innerWidth - size.width - 50
              )
            )
          ),

        y:
          Math.max(
            30,
            Math.round(
              Math.random() *
              Math.max(
                100,
                window.innerHeight - size.height - 120
              )
            )
          ),

        width:
          size.width,

        height:
          size.height,

        z_index:
          getNextZIndex(),

        rotation: 0
      };

      items.push(newItem);

      selectedItemId =
        newItem.id;

      render();

      closeAddModal();

      setStatus("saving...");

      const success =
        await insertItem(newItem);

      if (success) {

        setStatus("saved");

      } else {

        setStatus(
          "save failed"
        );
      }
    }


    function getNextZIndex() {

      if (!items.length) {
        return 1;
      }

      return (
        Math.max(
          ...items.map(
            item =>
              Number(
                item.z_index || 1
              )
          )
        ) + 1
      );
    }

        );

      }

    /* ============================================================
       SAVE ALL
    ============================================================ */

    async function saveAll() {

      if (!adminMode) return;

      if (!items.length) {
        setStatus("nothing to save");
        return;
      }

      const pageNumber = archives.length + 1;
      const pageTitle = `PAGE ${String(pageNumber).padStart(3, "0")}`;
      const snapshot = items.map(item => ({
        id: item.id,
        type: item.type,
        content: item.content,
        title: item.title,
        category: item.category,
        x: Math.round(item.x),
        y: Math.round(item.y),
        width: Math.round(item.width),
        height: Math.round(item.height),
        z_index: Math.round(item.z_index),
        rotation: Number(item.rotation || 0)
      }));

      setStatus("saving page...");

      const { error: archiveError } = await supabaseClient
        .from("canvas_items")
        .insert({
          id: `archive_${makeId()}`,
          type: "archive_page",
          content: JSON.stringify(snapshot),
          title: pageTitle,
          category: "archive",
          x: 0,
          y: 0,
          width: 0,
          height: 0,
          z_index: pageNumber,
          rotation: 0
        });

      if (archiveError) {
        console.error(archiveError);
        setStatus("save failed");
        alert("아카이브 저장에 실패했습니다.\n\n" + archiveError.message);
        return;
      }

      const ids = items.map(item => item.id);
      const { error: deleteError } = await supabaseClient
        .from("canvas_items")
        .delete()
        .in("id", ids);

      if (deleteError) {
        console.error(deleteError);
        setStatus("archive saved");
        alert("아카이브는 저장됐지만 현재 도화지를 비우지 못했습니다.\n\n" + deleteError.message);
        await loadItems();
        return;
      }

      items = [];
      selectedItemId = null;
      activeCategory = "all";

      document.querySelectorAll(".category-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.category === "all");
      });

      await loadArchives();
      render();
      setStatus("page saved");
    }


    /* ============================================================
       DELETE
    ============================================================ */

    async function deleteItem(id) {

      if (!adminMode) {
        return;
      }

      const ok =
        confirm(
          "이 작품을 삭제할까요?"
        );

      if (!ok) {
        return;
      }

      setStatus("deleting...");

      const {
        error
      } =
        await supabaseClient
          .from("canvas_items")
          .delete()
          .eq(
            "id",
            id
          );

      if (error) {

        console.error(error);

        alert(
          "삭제하지 못했습니다.\n\n" +
          error.message
        );

        setStatus("error");

        return;
      }

      items =
        items.filter(
          item =>
            item.id !== id
        );

      selectedItemId = null;

      render();

      setStatus("deleted");
    }


    /* ============================================================
       ADMIN BUTTONS
    ============================================================ */

    document
      .getElementById("addText")
      .addEventListener("click", () => {
        if (!adminMode) return;
        openAddModal("text");
      });

    document
      .getElementById("addNote")
      .addEventListener("click", () => {
        if (!adminMode) return;
        openAddModal("note");
      });

    document
      .getElementById("addImage")
      .addEventListener("click", () => {
        if (!adminMode) return;
        openAddModal("image");
      });

    document
      .getElementById("addVideo")
      .addEventListener("click", () => {
        if (!adminMode) return;
        openAddModal("video");
      });

    document
      .getElementById("cancelAdd")
      .addEventListener("click", () => {
        closeAddModal();
      });

    document
      .getElementById("createItem")
      .addEventListener("click", createNewItem);

    document
      .getElementById("saveAll")
      .addEventListener("click", async () => {
        if (!adminMode) return;
        await saveAll();
      });

    /* ============================================================
       CATEGORY
    ============================================================ */

    document
      .querySelectorAll(".category-btn")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            activeCategory =
              button.dataset.category;

            document.getElementById("archiveViewer").classList.remove("show");

            document
              .querySelectorAll(
                ".category-btn"
              )
              .forEach(btn => {
                btn.classList.remove(
                  "active"
                );
              });

            button.classList.add(
              "active"
            );

            selectedItemId = null;

            render();
          }
        );
      });


    document
      .getElementById("archiveViewerRestore")
      .addEventListener("click", restoreArchivePage);


    document
      .getElementById("archiveViewerClose")
      .addEventListener("click", () => {
        document.getElementById("archiveViewer").classList.remove("show");
      });


    /* ============================================================
       LOGIN
    ============================================================ */


    /* ============================================================
       AUTHENTICATION UI
    ============================================================ */

    function updateAdminUI(session) {

      currentSession = session || null;

      adminMode = !!currentSession;

      if (adminMode) {

        document.body.classList.add(
          "admin-mode"
        );

        document.getElementById(
          "adminOpen"
        ).textContent =
          "LOGOUT";

        setStatus("admin");

      } else {

        document.body.classList.remove(
          "admin-mode"
        );

        selectedItemId = null;

        document.getElementById(
          "adminOpen"
        ).textContent =
          "ADMIN";

        setStatus("ready");
      }

      render();
    }


    document
      .getElementById("adminOpen")
      .addEventListener(
        "click",
        async () => {

          if (adminMode) {

            await logout();

            return;
          }

          loginError.style.display =
            "none";

          emailInput.value = "";
          passwordInput.value = "";

          loginModal.classList.add(
            "show"
          );

          setTimeout(() => {
            emailInput.focus();
          }, 100);
        }
      );


    document
      .getElementById("cancelLogin")
      .addEventListener(
        "click",
        () => {

          loginModal.classList.remove(
            "show"
          );
        }
      );


    document
      .getElementById("loginButton")
      .addEventListener(
        "click",
        login
      );


    emailInput
      .addEventListener(
        "keydown",
        event => {

          if (
            event.key === "Enter"
          ) {
            passwordInput.focus();
          }
        }
      );


    passwordInput
      .addEventListener(
        "keydown",
        event => {

          if (
            event.key === "Enter"
          ) {
            login();
          }
        }
      );


    async function login() {

      const email =
        emailInput.value.trim();

      const password =
        passwordInput.value;

      if (!email || !password) {

        loginError.textContent =
          "email and password are required";

        loginError.style.display =
          "block";

        return;
      }

      loginError.style.display =
        "none";

      setStatus("logging in...");

      const {
        data,
        error
      } =
        await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

      if (error) {

        console.error(error);

        loginError.textContent =
          "email or password is incorrect";

        loginError.style.display =
          "block";

        setStatus("ready");

        return;
      }

      updateAdminUI(data.session);

      loginModal.classList.remove(
        "show"
      );

      emailInput.value = "";
      passwordInput.value = "";
    }


    async function logout() {

      const {
        error
      } =
        await supabaseClient.auth.signOut();

      if (error) {

        console.error(error);

        alert(
          "로그아웃하지 못했습니다.\n\n" +
          error.message
        );

        return;
      }

      updateAdminUI(null);
    }


    /* ============================================================
       AUTH STATE
    ============================================================ */

    supabaseClient.auth.onAuthStateChange(
      (_event, session) => {

        updateAdminUI(session);
      }
    );


    /* ============================================================
       START
    ============================================================ */

    async function startApp() {

      const {
        data: {
          session
        }
      } =
        await supabaseClient.auth.getSession();

      updateAdminUI(session);

      await loadItems();
    }


    startApp();

  </script>
