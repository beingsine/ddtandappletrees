<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ddt and apple trees — Infinite Archive</title>
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #ffffff;
      font-family: 'Courier New', monospace;
      overflow: hidden;
      user-select: none;
    }

    /* 1. 상단 컨트롤 바 */
    .top-bar {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 9999;
      display: flex;
      gap: 10px;
      background: rgba(255, 255, 255, 0.95);
      padding: 8px 12px;
      border: 1px solid #111;
      box-shadow: 2px 2px 0px #111;
    }
    .btn {
      background: none;
      border: 1px solid #ccc;
      padding: 6px 12px;
      font-family: inherit;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn.active, .btn:hover {
      background: #111;
      color: #fff;
      border-color: #111;
    }
    .btn-history {
      background: #f4f4f4;
      border-color: #111;
      font-weight: bold;
    }

    /* 2. 관리자 컨트롤 패널 */
    .admin-panel {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
      display: none;
      gap: 8px;
      background: #111;
      color: #fff;
      padding: 8px 12px;
      font-size: 0.75rem;
      align-items: center;
      flex-wrap: wrap;
      max-width: 80vw;
    }
    .admin-btn {
      background: #fff;
      color: #111;
      border: none;
      padding: 6px 10px;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
    }
    .admin-btn:hover { background: #e63946; color: #fff; }

    /* 3. 백지 도화지 캔버스 */
    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #ffffff;
      transform-origin: center center;
    }

    @keyframes ripCanvas {
      0% {
        clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
        transform: scale(1) rotate(0deg);
        opacity: 1;
      }
      30% {
        clip-path: polygon(0 0, 45% 15%, 55% 85%, 100% 0, 100% 100%, 0 100%);
      }
      70% {
        clip-path: polygon(0 0, 20% 40%, 80% 60%, 100% 10%, 90% 90%, 10% 90%);
        transform: scale(0.85) rotate(-3deg) translateY(50px);
        opacity: 0.7;
      }
      100% {
        clip-path: polygon(0 0, 0 0, 100% 100%, 100% 100%);
        transform: scale(0.6) rotate(12deg) translateY(300px);
        opacity: 0;
      }
    }
    .canvas-ripping {
      animation: ripCanvas 1.2s cubic-bezier(0.55, 0.055, 0.675, 0.19) forwards;
    }

    /* 4. 콜라주 미디어 요소 */
    .draggable {
      position: absolute;
      display: flex;
      flex-direction: column;
      background: #fff;
      border: 1px solid transparent;
      overflow: hidden;
      cursor: pointer;
    }
    body.admin-mode .draggable {
      border: 1px solid #ddd;
      box-shadow: 2px 2px 8px rgba(0,0,0,0.08);
      outline: 1px dashed #aaa;
      resize: both;
      overflow: auto;
      cursor: default;
    }

    .drag-handle {
      display: none;
      background: #111;
      color: #fff;
      padding: 4px 8px;
      font-size: 0.7rem;
      font-weight: bold;
      cursor: grab;
      justify-content: space-between;
      align-items: center;
      user-select: none;
      flex-shrink: 0;
    }
    body.admin-mode .drag-handle {
      display: flex;
    }
    .drag-handle:active {
      cursor: grabbing;
    }

    .delete-btn {
      color: #ff4d4d;
      font-weight: bold;
      cursor: pointer;
      margin-left: 8px;
    }

    .media-content {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .media-content img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }
    .media-content video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .audio-box {
      padding: 10px;
      width: 100%;
      background: #fafafa;
    }
    .audio-box audio { width: 100%; }

    .text-box {
      padding: 12px;
      font-size: 0.9rem;
      line-height: 1.5;
      color: #111;
      white-space: pre-wrap;
      word-break: break-word;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      background: #fff;
    }

    .iframe-box {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* 5. 방문자 확대 보기 */
    .lightbox-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      z-index: 20000;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 30px;
    }
    .lightbox-content {
      max-width: 90vw;
      max-height: 85vh;
      background: #fff;
      padding: 15px;
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: auto;
    }
    .lightbox-close {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 1.5rem;
      font-weight: bold;
      color: #111;
      cursor: pointer;
      z-index: 20001;
    }

    /* 6. 히스토리 모달 */
    .history-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(255, 255, 255, 0.96);
      z-index: 10000;
      display: none;
      padding: 40px;
      overflow-y: auto;
    }
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #111;
      padding-bottom: 12px;
      margin-bottom: 30px;
    }
    .history-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    .history-card {
      border: 1px solid #111;
      padding: 16px;
      background: #fff;
      cursor: pointer;
      border-top: 4px solid #111;
      transition: transform 0.2s;
    }
    .history-card:hover {
      transform: translateY(-4px);
      box-shadow: 4px 4px 0px #111;
    }

    .hidden-by-filter { display: none !important; }

    .admin-trigger {
      position: fixed;
      bottom: 10px;
      right: 10px;
      font-size: 0.75rem;
      color: #aaa;
      background: #f0f0f0;
      padding: 4px 8px;
      border: 1px solid #ccc;
      cursor: pointer;
      z-index: 9999;
    }
    .admin-trigger:hover {
      background: #111;
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- 상단 카테고리 필터 & 히스토리 -->
  <div class="top-bar">
    <button class="btn active" onclick="filterCategory('ALL')">ALL</button>
    <button class="btn" onclick="filterCategory('IMAGE')">IMAGE</button>
    <button class="btn" onclick="filterCategory('VIDEO')">VIDEO</button>
    <button class="btn" onclick="filterCategory('AUDIO')">AUDIO</button>
    <button class="btn" onclick="filterCategory('TEXT')">TEXT</button>
    <span style="border-left: 1px solid #ccc; margin: 0 4px;"></span>
    <button class="btn btn-history" onclick="toggleHistoryModal(true)">📜 HISTORIES</button>
  </div>

  <!-- 관리자 전용 패널 -->
  <div class="admin-panel" id="adminPanel">
    <span>[ADMIN MODE]</span>
    <button class="admin-btn" style="background:#48bb78; color:#fff;" onclick="addLinkPrompt()">🔗 링크/URL 추가</button>
    <button class="admin-btn" style="background:#ed8936; color:#fff;" onclick="addTextPrompt()">📝 텍스트 작성</button>
    <button class="admin-btn" onclick="tearCurrentCanvas()">✂️ 도화지 찢어서 보관</button>
    <button class="admin-btn" style="background:#888; color:#fff;" onclick="toggleAdminMode(false)">X</button>
  </div>

  <!-- 캔버스 영역 -->
  <div id="canvas"></div>

  <!-- 방문자 확대 보기 (라이트박스) 모달 -->
  <div class="lightbox-modal" id="lightboxModal" onclick="closeLightbox()">
    <div class="lightbox-content" id="lightboxContent" onclick="event.stopPropagation()">
      <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
      <div id="lightboxBody"></div>
    </div>
  </div>

  <!-- 히스토리 모달 -->
  <div class="history-modal" id="historyModal">
    <div class="history-header">
      <h2 style="margin:0; font-size:1.2rem;">RIPPED CANVAS HISTORIES</h2>
      <button class="btn" onclick="toggleHistoryModal(false)">CLOSE [X]</button>
    </div>
    <div class="history-grid" id="historyGrid"></div>
  </div>

  <!-- 로그인 트리거 -->
  <div class="admin-trigger" onclick="promptAdminLogin()">🔒 Admin Login</div>

  <script>
    // Supabase 설정
    const SUPABASE_URL = 'https://ntO5tHSW-9G-yil3kLi3oQ.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_ntO5tHSW-9G-yil3kLi3oQ_r8hwxyhI';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentCanvasItems = [];
    let histories = [];
    let highestZ = 100;
    let isAdmin = false;
    let currentFilter = 'ALL';

    // 1. Supabase에서 데이터 불러오기 (새로고침 시 자동 실행)
    async function loadItemsFromSupabase() {
      const { data, error } = await _supabase
        .from('canvas_items')
        .select('*')
        .order('created_at', { ascending: true });

      if (error) {
        console.error('데이터를 불러오지 못했습니다:', error);
        return;
      }

      if (data) {
        currentCanvasItems = data.map(item => ({
          id: item.id,
          type: item.type,
          category: item.category,
          title: item.title,
          src: item.src,
          text: item.text,
          top: Number(item.top),
          left: Number(item.left),
          width: Number(item.width),
          height: Number(item.height),
          zIndex: Number(item.z_index) || 100
        }));
        renderCanvas(currentCanvasItems);
      }
    }

    // 2. Supabase에 데이터 저장
    async function saveItemToSupabase(item) {
      const { error } = await _supabase.from('canvas_items').upsert([{
        id: item.id,
        type: item.type,
        category: item.category,
        title: item.title || '',
        src: item.src || '',
        text: item.text || '',
        top: item.top,
        left: item.left,
        width: item.width,
        height: item.height,
        z_index: item.zIndex
      }]);

      if (error) console.error('Supabase 저장 오류:', error);
    }

    // 3. Supabase에서 항목 삭제
    async function deleteItemFromSupabase(id) {
      const { error } = await _supabase.from('canvas_items').delete().eq('id', id);
      if (error) console.error('Supabase 삭제 오류:', error);
    }

    // 4. 캔버스 렌더링
    function renderCanvas(items) {
      const canvas = document.getElementById('canvas');
      canvas.innerHTML = '';

      items.forEach(item => {
        const el = document.createElement('div');
        el.className = 'draggable';
        el.setAttribute('data-id', item.id);
        el.setAttribute('data-category', item.category);
        el.style.top = `${item.top}px`;
        el.style.left = `${item.left}px`;
        el.style.width = item.width ? `${item.width}px` : 'auto';
        el.style.height = item.height ? `${item.height}px` : 'auto';
        el.style.zIndex = item.zIndex;

        let handleHTML = `
          <div class="drag-handle">
            <span>:: ${item.title || item.type}</span>
            <span class="delete-btn" onclick="deleteItem('${item.id}', event)">✕</span>
          </div>`;

        let contentHTML = '';
        if (item.type === 'IMAGE') {
          contentHTML = `<div class="media-content"><img src="${item.src}"></div>`;
        } else if (item.type === 'VIDEO') {
          contentHTML = `<div class="media-content"><video controls muted autoplay loop playsinline><source src="${item.src}"></video></div>`;
        } else if (item.type === 'AUDIO') {
          contentHTML = `<div class="media-content audio-box"><audio controls loop><source src="${item.src}"></audio></div>`;
        } else if (item.type === 'TEXT') {
          contentHTML = `<div class="text-box">${escapeHtml(item.text)}</div>`;
        } else if (item.type === 'EMBED') {
          contentHTML = `<iframe class="iframe-box" src="${item.src}" allowfullscreen></iframe>`;
        }

        el.innerHTML = handleHTML + contentHTML;
        canvas.appendChild(el);

        if (window.ResizeObserver) {
          const ro = new ResizeObserver(entries => {
            for (let entry of entries) {
              if (isAdmin) {
                item.width = Math.round(entry.contentRect.width);
                item.height = Math.round(entry.contentRect.height);
                saveItemToSupabase(item);
              }
            }
          });
          ro.observe(el);
        }

        el.addEventListener('click', (e) => {
          if (!isAdmin && !e.target.closest('audio') && !e.target.closest('video') && !e.target.closest('iframe')) {
            openLightbox(item);
          }
        });

        const handleEl = el.querySelector('.drag-handle');
        attachDragEvents(el, handleEl, item);
      });

      applyFilter();
    }

    // 5. 외부 링크/유튜브/음악 추가
    function addLinkPrompt() {
      if (!isAdmin) return;
      const url = prompt("YouTube, Vimeo, MP3, 이미지 또는 웹페이지 URL을 입력하세요:");
      if (!url) return;

      let type = 'EMBED';
      let category = 'VIDEO';
      let embedSrc = url.trim();

      if (embedSrc.includes('youtube.com/watch') || embedSrc.includes('youtu.be/')) {
        let videoId = '';
        if (embedSrc.includes('youtu.be/')) {
          videoId = embedSrc.split('youtu.be/')[1].split('?')[0];
        } else {
          videoId = new URL(embedSrc).searchParams.get('v');
        }
        embedSrc = `https://www.youtube.com/embed/${videoId}`;
        category = 'VIDEO';
      } else if (embedSrc.match(/\.(jpeg|jpg|gif|png|webp)$/i)) {
        type = 'IMAGE';
        category = 'IMAGE';
      } else if (embedSrc.match(/\.(mp3|wav|ogg)$/i)) {
        type = 'AUDIO';
        category = 'AUDIO';
      }

      const newItem = {
        id: "link_" + Date.now(),
        type: type,
        category: category,
        title: "Link Asset",
        src: embedSrc,
        top: 150,
        left: 150,
        width: 360,
        height: type === 'AUDIO' ? 80 : 240,
        zIndex: ++highestZ
      };

      currentCanvasItems.push(newItem);
      renderCanvas(currentCanvasItems);
      saveItemToSupabase(newItem);
    }

    // 6. 텍스트 노트 추가
    function addTextPrompt() {
      if (!isAdmin) return;
      const text = prompt("도화지에 게시할 글을 입력하세요:");
      if (!text) return;

      const newItem = {
        id: "txt_" + Date.now(),
        type: 'TEXT',
        category: 'TEXT',
        title: 'Note',
        text: text,
        top: 180,
        left: 180,
        width: 280,
        height: 160,
        zIndex: ++highestZ
      };

      currentCanvasItems.push(newItem);
      renderCanvas(currentCanvasItems);
      saveItemToSupabase(newItem);
    }

    function deleteItem(id, e) {
      e.stopPropagation();
      if (!isAdmin) return;
      currentCanvasItems = currentCanvasItems.filter(item => item.id !== id);
      renderCanvas(currentCanvasItems);
      deleteItemFromSupabase(id);
    }

    // 7. 드래그 이동
    function attachDragEvents(element, handleElement, itemObj) {
      let isDragging = false;
      let startX, startY, initialLeft, initialTop;

      if (!handleElement) return;

      handleElement.addEventListener('mousedown', (e) => {
        if (!isAdmin) return;

        isDragging = true;
        element.style.zIndex = ++highestZ;
        itemObj.zIndex = highestZ;

        startX = e.clientX;
        startY = e.clientY;
        const rect = element.getBoundingClientRect();
        initialLeft = rect.left;
        initialTop = rect.top;

        const onMouseMove = (ev) => {
          if (!isDragging || !isAdmin) return;
          const newLeft = initialLeft + (ev.clientX - startX);
          const newTop = initialTop + (ev.clientY - startY);
          element.style.left = `${newLeft}px`;
          element.style.top = `${newTop}px`;
          itemObj.left = newLeft;
          itemObj.top = newTop;
        };

        const onMouseUp = () => {
          if (isDragging) {
            isDragging = false;
            saveItemToSupabase(itemObj);
          }
          document.removeEventListener('mousemove', onMouseMove);
          document.removeEventListener('mouseup', onMouseUp);
        };

        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
      });
    }

    // 8. 방문자 클릭시 원본/확대 보기 (Lightbox)
    function openLightbox(item) {
      const modal = document.getElementById('lightboxModal');
      const body = document.getElementById('lightboxBody');
      body.innerHTML = '';

      if (item.type === 'IMAGE') {
        body.innerHTML = `<img src="${item.src}" style="max-width:100%; max-height:75vh; display:block;">`;
      } else if (item.type === 'VIDEO') {
        body.innerHTML = `<video src="${item.src}" controls muted style="max-width:100%; max-height:75vh;"></video>`;
      } else if (item.type === 'AUDIO') {
        body.innerHTML = `<div style="padding:20px; width:320px;"><audio src="${item.src}" controls style="width:100%;"></audio></div>`;
      } else if (item.type === 'TEXT') {
        body.innerHTML = `<div style="padding:20px; max-width:600px; font-size:1.1rem; line-height:1.6; white-space:pre-wrap;">${escapeHtml(item.text)}</div>`;
      } else if (item.type === 'EMBED') {
        body.innerHTML = `<iframe src="${item.src}" style="width:70vw; height:60vh; border:none;" allowfullscreen></iframe>`;
      }

      modal.style.display = 'flex';
    }

    function closeLightbox() {
      document.getElementById('lightboxModal').style.display = 'none';
      document.getElementById('lightboxBody').innerHTML = '';
    }

    // 9. 도화지 찢기 & 보관
    async function tearCurrentCanvas() {
      if (!isAdmin) return;
      if (currentCanvasItems.length === 0) {
        alert("현재 도화지가 비어있습니다.");
        return;
      }

      const canvas = document.getElementById('canvas');
      canvas.classList.add('canvas-ripping');

      setTimeout(async () => {
        const newHistory = {
          id: `piece_${String(histories.length + 1).padStart(3, '0')}`,
          title: `Collage #${String(histories.length + 1).padStart(2, '0')} — Ripped`,
          date: new Date().toISOString().slice(0, 10),
          items: JSON.parse(JSON.stringify(currentCanvasItems))
        };
        histories.unshift(newHistory);

        // Supabase DB 비우기
        for (const item of currentCanvasItems) {
          await deleteItemFromSupabase(item.id);
        }

        currentCanvasItems = [];
        canvas.classList.remove('canvas-ripping');
        renderCanvas(currentCanvasItems);

        alert("현재 도화지가 찢어져 히스토리에 보관되었습니다.");
      }, 1200);
    }

    // 10. 히스토리 모달
    function toggleHistoryModal(show) {
      const modal = document.getElementById('historyModal');
      modal.style.display = show ? 'block' : 'none';

      if (show) {
        const grid = document.getElementById('historyGrid');
        grid.innerHTML = '';

        if (histories.length === 0) {
          grid.innerHTML = '<p style="color:#888;">보관된 과거 도화지가 없습니다.</p>';
          return;
        }

        histories.forEach(h => {
          const card = document.createElement('div');
          card.className = 'history-card';
          card.innerHTML = `
            <div style="font-size:0.7rem; color:#888;">${h.date}</div>
            <div style="font-weight:bold; font-size:0.95rem; margin:6px 0;">${h.title}</div>
            <div style="font-size:0.75rem; color:#555;">Items: ${h.items.length}</div>
            <div style="margin-top:10px; font-size:0.7rem; text-decoration:underline;">Click to view 👁</div>
          `;
          card.onclick = () => {
            renderCanvas(h.items);
            toggleHistoryModal(false);
          };
          grid.appendChild(card);
        });
      }
    }

    // 11. 카테고리 필터
    function filterCategory(cat) {
      currentFilter = cat;
      document.querySelectorAll('.top-bar .btn').forEach(btn => {
        if (['ALL','IMAGE','VIDEO','AUDIO','TEXT'].includes(btn.innerText)) {
          btn.classList.toggle('active', btn.innerText === cat);
        }
      });
      applyFilter();
    }

    function applyFilter() {
      document.querySelectorAll('.draggable').forEach(el => {
        const itemCat = el.getAttribute('data-category');
        if (currentFilter === 'ALL' || itemCat === currentFilter) {
          el.classList.remove('hidden-by-filter');
        } else {
          el.classList.add('hidden-by-filter');
        }
      });
    }

    // 12. 관리자 인증 (비밀번호: 0322)
    function promptAdminLogin() {
      const input = prompt("관리자 비밀번호를 입력하세요:");
      if (input === null) return;

      if (String(input).trim() === "0322") {
        alert("관리자 모드로 전환되었습니다.");
        toggleAdminMode(true);
      } else {
        alert("비밀번호가 올바르지 않습니다.");
      }
    }

    function toggleAdminMode(enable) {
      isAdmin = enable;
      document.body.classList.toggle('admin-mode', enable);
      document.getElementById('adminPanel').style.display = enable ? 'flex' : 'none';
      renderCanvas(currentCanvasItems);
    }

    function escapeHtml(str) {
      return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;") : '';
    }

    // 페이지 진입 시 DB 데이터 로드
    window.addEventListener('DOMContentLoaded', () => {
      loadItemsFromSupabase();
    });
  </script>
</body>
