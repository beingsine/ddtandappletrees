<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Archive Canvas</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      user-select: none;
      background-color: #f8fafc;
      background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
      background-size: 24px 24px;
    }
    .canvas-item {
      position: absolute;
      touch-action: none;
      transition: box-shadow 0.15s ease;
    }
    .canvas-item:hover {
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }
    .resize-handle {
      position: absolute;
      width: 12px;
      height: 12px;
      right: 2px;
      bottom: 2px;
      cursor: se-resize;
      background-color: #cbd5e1;
      border-radius: 2px;
    }
    .note-bg {
      background-color: #fef08a;
    }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col font-sans text-slate-800">

  <!-- Header / Toolbar -->
  <header class="bg-white/80 backdrop-blur-md border-b border-slate-200 px-6 py-3 flex items-center justify-between z-50">
    <div class="flex items-center space-x-3">
      <h1 class="text-xl font-bold tracking-tight text-slate-900">Archive Canvas</h1>
      <span id="adminBadge" class="hidden text-xs bg-red-100 text-red-700 font-semibold px-2.5 py-0.5 rounded-full">Admin Mode</span>
    </div>

    <!-- Controls -->
    <div class="flex items-center space-x-2">
      <div id="adminControls" class="hidden flex items-center space-x-2">
        <button onclick="openAddModal('text')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg text-sm font-medium transition">+ 텍스트</button>
        <button onclick="openAddModal('note')" class="bg-amber-100 hover:bg-amber-200 text-amber-800 px-3 py-1.5 rounded-lg text-sm font-medium transition">+ 메모</button>
        <button onclick="openAddModal('image')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg text-sm font-medium transition">+ 이미지</button>
        <button onclick="openAddModal('video')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg text-sm font-medium transition">+ 유튜브</button>
      </div>
      <button onclick="toggleAdminMode()" id="adminToggleBtn" class="bg-slate-900 hover:bg-slate-800 text-white px-4 py-1.5 rounded-lg text-sm font-medium transition">관리자 로그인</button>
    </div>
  </header>

  <!-- Main Canvas -->
  <main id="canvas" class="flex-1 relative overflow-hidden">
    <!-- Canvas items will render dynamically -->
  </main>

  <!-- Add Item Modal -->
  <div id="addModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center z-50">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 m-4">
      <h2 id="modalTitle" class="text-lg font-bold mb-4">항목 추가</h2>
      <input type="hidden" id="modalItemType" />
      
      <div class="mb-4">
        <label id="modalInputLabel" class="block text-sm font-medium text-slate-700 mb-1">내용</label>
        <textarea id="modalInputContent" rows="4" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-slate-900 focus:outline-none" placeholder="내용을 입력하세요..."></textarea>
      </div>

      <div class="flex justify-end space-x-2">
        <button onclick="closeAddModal()" class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg">취소</button>
        <button onclick="submitNewItem()" class="px-4 py-2 text-sm bg-slate-900 text-white rounded-lg hover:bg-slate-800">추가</button>
      </div>
    </div>
  </div>

  <script>
    // --- Config & State ---
    // 실제 Supabase URL과 Key로 변경하세요
    const SUPABASE_URL = "https://your-project.supabase.co";
    const SUPABASE_ANON_KEY = "your-anon-key";
    
    let supabase = null;
    if (SUPABASE_URL !== "https://your-project.supabase.co" && window.supabase) {
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    let isAdmin = false;
    let items = [];
    let maxZIndex = 1;

    // --- Debounce Utility ---
    function debounce(func, wait = 300) {
      let timeout;
      return function (...args) {
        clearTimeout(timeout);
        timeout = setTimeout(() => func.apply(this, args), wait);
      };
    }

    // --- LocalStorage Fallback Storage ---
    function saveToLocalStorage() {
      localStorage.setItem('canvas_items_backup', JSON.stringify(items));
    }

    function loadFromLocalStorage() {
      const stored = localStorage.getItem('canvas_items_backup');
      if (stored) {
        try {
          return JSON.parse(stored);
        } catch(e) {
          console.error("LocalStorage parse error", e);
        }
      }
      return [];
    }

    // --- YouTube URL Parser ---
    function extractYouTubeId(url) {
      if (!url) return null;
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=|shorts\/)([^#&?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    // --- DB & Storage Operations ---
    const saveItemToSupabase = debounce(async (item) => {
      saveToLocalStorage(); // 항상 LocalStorage 백업

      if (!supabase) return;
      const { error } = await supabase.from('canvas_items').upsert({
        id: item.id,
        type: item.type,
        content: item.content,
        x: item.x,
        y: item.y,
        width: item.width,
        height: item.height,
        z_index: item.z_index
      });
      if (error) console.error("Supabase Save Error:", error.message);
    }, 400);

    async function deleteItemFromSupabase(id) {
      saveToLocalStorage(); // 항상 LocalStorage 백업

      if (!supabase) return;
      const { error } = await supabase.from('canvas_items').delete().eq('id', id);
      if (error) console.error("Supabase Delete Error:", error.message);
    }

    async function loadItems() {
      let loadedData = [];
      if (supabase) {
        const { data, error } = await supabase.from('canvas_items').select('*');
        if (error) {
          console.error("Supabase Fetch Error:", error.message);
          loadedData = loadFromLocalStorage();
        } else if (data && data.length > 0) {
          loadedData = data;
        } else {
          loadedData = loadFromLocalStorage();
        }
      } else {
        loadedData = loadFromLocalStorage();
      }

      items = loadedData;
      items.forEach(i => { if (i.z_index > maxZIndex) maxZIndex = i.z_index; });
      renderCanvas();
    }

    // --- UI Render & Interactions ---
    function renderCanvas() {
      const canvas = document.getElementById('canvas');
      canvas.innerHTML = '';

      items.forEach(item => {
        const el = document.createElement('div');
        el.className = `canvas-item rounded-xl p-3 shadow-sm border border-slate-200/80 bg-white ${item.type === 'note' ? 'note-bg border-amber-300' : ''}`;
        el.style.left = `${item.x}px`;
        el.style.top = `${item.y}px`;
        el.style.width = `${item.width}px`;
        el.style.height = `${item.height}px`;
        el.style.zIndex = item.z_index || 1;

        // Item Content Rendering
        let contentHtml = '';
        if (item.type === 'text') {
          contentHtml = `<p class="whitespace-pre-wrap text-sm text-slate-800">${item.content}</p>`;
        } else if (item.type === 'note') {
          contentHtml = `<p class="whitespace-pre-wrap text-sm text-amber-950 font-medium">${item.content}</p>`;
        } else if (item.type === 'image') {
          contentHtml = `<img src="${item.content}" class="w-full h-full object-cover rounded-lg pointer-events-none" alt="canvas img" onerror="this.onerror=null; this.src='https://via.placeholder.com/150?text=Image+Error';" />`;
        } else if (item.type === 'video') {
          const videoId = extractYouTubeId(item.content);
          if (videoId) {
            contentHtml = `<iframe class="w-full h-full rounded-lg pointer-events-none" src="https://www.youtube.com/embed/${videoId}" frameborder="0" allowfullscreen></iframe>`;
          } else {
            contentHtml = `<p class="text-xs text-red-500">잘못된 유튜브 URL입니다.</p>`;
          }
        }

        // Delete Button for Admin
        const deleteBtn = isAdmin ? `
          <button onclick="removeItem('${item.id}', event)" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs hover:bg-red-600 shadow">×</button>
        ` : '';

        // Resize handle for Admin
        const resizeHandle = isAdmin ? `<div class="resize-handle"></div>` : '';

        el.innerHTML = `${deleteBtn}${contentHtml}${resizeHandle}`;

        // Event Handling
        setupInteractions(el, item);
        canvas.appendChild(el);
      });
    }

    function setupInteractions(el, item) {
      let isDragging = false;
      let isResizing = false;
      let startX, startY, startLeft, startTop, startWidth, startHeight;

      const handleDown = (e) => {
        maxZIndex++;
        item.z_index = maxZIndex;
        el.style.zIndex = maxZIndex;
        saveItemToSupabase(item);

        if (!isAdmin) return;

        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;

        if (e.target.classList.contains('resize-handle')) {
          isResizing = true;
          startWidth = item.width;
          startHeight = item.height;
          startX = clientX;
          startY = clientY;
        } else {
          isDragging = true;
          startLeft = item.x;
          startTop = item.y;
          startX = clientX;
          startY = clientY;
        }

        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleUp);
        window.addEventListener('touchmove', handleMove);
        window.addEventListener('touchend', handleUp);
      };

      const handleMove = (e) => {
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;

        if (isDragging) {
          item.x = startLeft + (clientX - startX);
          item.y = startTop + (clientY - startY);
          el.style.left = `${item.x}px`;
          el.style.top = `${item.y}px`;
          saveItemToSupabase(item);
        } else if (isResizing) {
          item.width = Math.max(120, startWidth + (clientX - startX));
          item.height = Math.max(80, startHeight + (clientY - startY));
          el.style.width = `${item.width}px`;
          el.style.height = `${item.height}px`;
          saveItemToSupabase(item);
        }
      };

      const handleUp = () => {
        isDragging = false;
        isResizing = false;
        window.removeEventListener('mousemove', handleMove);
        window.removeEventListener('mouseup', handleUp);
        window.removeEventListener('touchmove', handleMove);
        window.removeEventListener('touchend', handleUp);
      };

      el.addEventListener('mousedown', handleDown);
      el.addEventListener('touchstart', handleDown, { passive: true });
    }

    // --- Admin Toggle & Modals ---
    function toggleAdminMode() {
      if (!isAdmin) {
        const pwd = prompt("관리자 비밀번호를 입력하세요:");
        if (pwd === "0322") {
          isAdmin = true;
          document.getElementById('adminBadge').classList.remove('hidden');
          document.getElementById('adminControls').classList.remove('hidden');
          document.getElementById('adminToggleBtn').innerText = "관리자 로그아웃";
        } else if (pwd !== null) {
          alert("비밀번호가 올바르지 않습니다.");
        }
      } else {
        isAdmin = false;
        document.getElementById('adminBadge').classList.add('hidden');
        document.getElementById('adminControls').classList.add('hidden');
        document.getElementById('adminToggleBtn').innerText = "관리자 로그인";
      }
      renderCanvas();
    }

    function openAddModal(type) {
      document.getElementById('modalItemType').value = type;
      const contentInput = document.getElementById('modalInputContent');
      contentInput.value = '';

      const labels = {
        text: '텍스트 내용',
        note: '메모 내용',
        image: '이미지 URL',
        video: '유튜브 링크 URL'
      };
      document.getElementById('modalInputLabel').innerText = labels[type] || '내용';
      document.getElementById('addModal').classList.remove('hidden');
      document.getElementById('addModal').classList.add('flex');
    }

    function closeAddModal() {
      document.getElementById('addModal').classList.add('hidden');
      document.getElementById('addModal').classList.remove('flex');
    }

    function submitNewItem() {
      const type = document.getElementById('modalItemType').value;
      const content = document.getElementById('modalInputContent').value.trim();

      if (!content) return alert("내용을 입력해주세요.");

      maxZIndex++;
      const newItem = {
        id: 'item_' + Date.now(),
        type,
        content,
        x: 100 + (items.length * 20) % 300,
        y: 100 + (items.length * 20) % 300,
        width: type === 'video' ? 320 : 200,
        height: type === 'video' ? 180 : 150,
        z_index: maxZIndex
      };

      items.push(newItem);
      saveItemToSupabase(newItem);
      renderCanvas();
      closeAddModal();
    }

    function removeItem(id, e) {
      e.stopPropagation();
      if (!confirm("이 항목을 삭제하시겠습니까?")) return;
      items = items.filter(i => i.id !== id);
      deleteItemFromSupabase(id);
      renderCanvas();
    }

    // Initialize
    window.addEventListener('DOMContentLoaded', loadItems);
  </script>
</body>
</html>
