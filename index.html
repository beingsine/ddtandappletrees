<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>ddt and apple trees</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: white;
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* -------------------------
       HEADER
    ------------------------- */

    #header {
      position: fixed;
      z-index: 10000;
      top: 0;
      left: 0;
      width: 100%;
      height: 54px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 18px;

      background: rgba(255, 255, 255, 0.94);
      border-bottom: 1px solid #e5e5e5;
    }

    #siteTitle {
      font-size: 15px;
      letter-spacing: 0.02em;
      font-weight: 500;
      white-space: nowrap;
    }

    #categories {
      display: flex;
      gap: 6px;
      align-items: center;
      overflow-x: auto;
      scrollbar-width: none;
    }

    #categories::-webkit-scrollbar {
      display: none;
    }

    .category-btn {
      border: 0;
      background: transparent;
      padding: 6px 9px;
      font-size: 11px;
      letter-spacing: 0.06em;
      color: #777;
    }

    .category-btn:hover {
      color: #111;
    }

    .category-btn.active {
      color: #111;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    #adminOpen {
      border: 0;
      background: transparent;
      font-size: 11px;
      color: #999;
      padding: 6px;
      margin-left: 8px;
    }

    #adminOpen:hover {
      color: #111;
    }

    /* -------------------------
       CANVAS
    ------------------------- */

    #canvas {
      position: fixed;
      left: 0;
      top: 54px;
      right: 0;
      bottom: 0;

      overflow: hidden;
      background: white;
    }

    #world {
      position: absolute;

      left: 0;
      top: 0;

      width: 100%;
      height: 100%;
    }

    /* -------------------------
       ITEMS
    ------------------------- */

    .item {
      position: absolute;

      user-select: none;
      -webkit-user-select: none;

      transform-origin: center center;
    }

    .item-inner {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .item-text {
      width: 100%;
      height: 100%;

      white-space: pre-wrap;
      word-break: break-word;

      font-size: 17px;
      line-height: 1.45;

      color: #111;

      overflow: hidden;
    }

    .item-note {
      width: 100%;
      height: 100%;

      padding: 14px;

      background: #fafafa;
      border: 1px solid #ddd;

      font-size: 14px;
      line-height: 1.5;

      overflow: hidden;
    }

    .item-image {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: contain;

      pointer-events: auto;
    }

    .video-frame {
      width: 100%;
      height: 100%;

      border: 0;

      display: block;
    }

    /* visitor mode */
    .visitor-video {
      pointer-events: auto;
    }

    /* admin mode */
    body.admin-mode .item {
      cursor: move;
      outline: 1px dashed transparent;
    }

    body.admin-mode .item:hover {
      outline: 1px dashed #aaa;
    }

    body.admin-mode .item.selected {
      outline: 1px solid #111;
    }

    body.admin-mode .item.selected .resize-handle,
    body.admin-mode .item.selected .rotate-handle,
    body.admin-mode .item.selected .delete-button {
      display: block;
    }

    body.admin-mode .video-frame {
      pointer-events: none;
    }

    .resize-handle {
      display: none;

      position: absolute;

      width: 12px;
      height: 12px;

      right: -6px;
      bottom: -6px;

      background: white;
      border: 1px solid #111;

      cursor: nwse-resize;
      z-index: 20;
    }

    .rotate-handle {
      display: none;

      position: absolute;

      width: 12px;
      height: 12px;

      left: 50%;
      top: -28px;

      transform: translateX(-50%);

      border-radius: 50%;

      background: white;
      border: 1px solid #111;

      cursor: grab;
      z-index: 20;
    }

    .rotate-line {
      display: none;

      position: absolute;

      width: 1px;
      height: 18px;

      left: 50%;
      top: -18px;

      background: #111;

      z-index: 19;
    }

    body.admin-mode .item.selected .rotate-line {
      display: block;
    }

    .delete-button {
      display: none;

      position: absolute;

      top: -10px;
      right: -10px;

      width: 20px;
      height: 20px;

      padding: 0;

      border-radius: 50%;
      border: 1px solid #111;

      background: white;

      font-size: 12px;
      line-height: 18px;

      z-index: 30;
    }

    /* -------------------------
       ADMIN BAR
    ------------------------- */

    #adminBar {
      display: none;

      position: fixed;
      z-index: 11000;

      left: 50%;
      bottom: 18px;

      transform: translateX(-50%);

      padding: 7px 9px;

      background: rgba(255, 255, 255, 0.97);

      border: 1px solid #ccc;

      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);

      gap: 5px;
      align-items: center;
    }

    body.admin-mode #adminBar {
      display: flex;
    }

    .admin-btn {
      border: 0;
      background: white;

      padding: 7px 9px;

      font-size: 10px;
      letter-spacing: 0.04em;

      color: #333;
    }

    .admin-btn:hover {
      background: #f1f1f1;
    }

    .admin-separator {
      width: 1px;
      height: 18px;
      background: #ddd;
      margin: 0 3px;
    }

    #saveStatus {
      font-size: 10px;
      color: #777;
      margin: 0 5px;
      white-space: nowrap;
    }

    /* -------------------------
       LOGIN MODAL
    ------------------------- */

    #loginModal,
    #addModal {
      display: none;

      position: fixed;
      z-index: 20000;

      inset: 0;

      background: rgba(255, 255, 255, 0.75);

      align-items: center;
      justify-content: center;
    }

    #loginModal.show,
    #addModal.show {
      display: flex;
    }

    .modal-box {
      width: min(420px, calc(100vw - 36px));

      background: white;

      border: 1px solid #ccc;

      padding: 24px;

      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.12);
    }

    .modal-title {
      font-size: 14px;
      margin-bottom: 18px;
    }

    .modal-input,
    .modal-select,
    .modal-textarea {
      width: 100%;

      border: 1px solid #ccc;

      background: white;

      padding: 10px 11px;

      margin-bottom: 10px;

      outline: none;
    }

    .modal-input:focus,
    .modal-select:focus,
    .modal-textarea:focus {
      border-color: #111;
    }

    .modal-textarea {
      min-height: 130px;
      resize: vertical;
    }

    .modal-row {
      display: flex;
      gap: 8px;
    }

    .modal-row > * {
      flex: 1;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 7px;
      margin-top: 12px;
    }

    .modal-btn {
      padding: 8px 12px;

      border: 1px solid #ccc;

      background: white;

      font-size: 11px;
    }

    .modal-btn.primary {
      background: #111;
      color: white;
      border-color: #111;
    }

    .modal-error {
      display: none;
      color: #c00;
      font-size: 11px;
      margin-top: 8px;
    }

    /* -------------------------
       EMPTY MESSAGE
    ------------------------- */

    #emptyMessage {
      position: absolute;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      color: #aaa;

      font-size: 12px;

      pointer-events: none;

      display: none;
    }

    /* -------------------------
       MOBILE
    ------------------------- */

    @media (max-width: 700px) {
      #header {
        height: auto;
        min-height: 54px;
        padding: 9px 12px;
        flex-wrap: wrap;
        gap: 3px;
      }

      #categories {
        order: 3;
        width: 100%;
        padding-bottom: 2px;
      }

      #canvas {
        top: 88px;
      }

      #adminBar {
        max-width: calc(100vw - 20px);
        overflow-x: auto;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header id="header">

    <div id="siteTitle">
      ddt and apple trees
    </div>

    <nav id="categories">

      <button class="category-btn active" data-category="all">
        ALL
      </button>

      <button class="category-btn" data-category="writing">
        WRITING
      </button>

      <button class="category-btn" data-category="theater">
        THEATER
      </button>

      <button class="category-btn" data-category="image">
        IMAGE
      </button>

      <button class="category-btn" data-category="video">
        VIDEO
      </button>

      <button class="category-btn" data-category="archive">
        ARCHIVE
      </button>

    </nav>

    <button id="adminOpen">
      ADMIN
    </button>

  </header>


  <!-- CANVAS -->
  <main id="canvas">
    <div id="world"></div>

    <div id="emptyMessage">
      nothing here yet
    </div>
  </main>


  <!-- ADMIN BAR -->
  <div id="adminBar">

    <button class="admin-btn" id="addText">
      + TEXT
    </button>

    <button class="admin-btn" id="addNote">
      + NOTE
    </button>

    <button class="admin-btn" id="addImage">
      + IMAGE
    </button>

    <button class="admin-btn" id="addVideo">
      + VIDEO
    </button>

    <div class="admin-separator"></div>

    <button class="admin-btn" id="saveAll">
      SAVE
    </button>

    <button class="admin-btn" id="logout">
      LOGOUT
    </button>

    <span id="saveStatus">
      ready
    </span>

  </div>


  <!-- LOGIN -->
  <div id="loginModal">

    <div class="modal-box">

      <div class="modal-title">
        administrator
      </div>

      <input
        id="passwordInput"
        class="modal-input"
        type="password"
        placeholder="password"
        autocomplete="off"
      />

      <div id="loginError" class="modal-error">
        wrong password
      </div>

      <div class="modal-actions">

        <button
          class="modal-btn"
          id="cancelLogin"
        >
          CANCEL
        </button>

        <button
          class="modal-btn primary"
          id="loginButton"
        >
          ENTER
        </button>

      </div>

    </div>

  </div>


  <!-- ADD ITEM -->
  <div id="addModal">

    <div class="modal-box">

      <div class="modal-title" id="addModalTitle">
        add item
      </div>

      <input
        id="itemTitle"
        class="modal-input"
        placeholder="title (optional)"
      />

      <select
        id="itemCategory"
        class="modal-select"
      >
        <option value="archive">ARCHIVE</option>
        <option value="writing">WRITING</option>
        <option value="theater">THEATER</option>
        <option value="image">IMAGE</option>
        <option value="video">VIDEO</option>
      </select>

      <textarea
        id="itemContent"
        class="modal-textarea"
        placeholder=""
      ></textarea>

      <div class="modal-actions">

        <button
          class="modal-btn"
          id="cancelAdd"
        >
          CANCEL
        </button>

        <button
          class="modal-btn primary"
          id="createItem"
        >
          ADD
        </button>

      </div>

    </div>

  </div>


  <script>

    /* ============================================================
       SUPABASE
    ============================================================ */

    const SUPABASE_URL =
      "https://ocqfspslmfddxzqvdygi.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_ntO5tHSW-9G-yil3kLi3oQ_r8hwxyhI";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    /* ============================================================
       ADMIN PASSWORD
       TEMPORARY TEST VERSION
    ============================================================ */

    const ADMIN_PASSWORD = "0322";


    /* ============================================================
       STATE
    ============================================================ */

    let items = [];

    let activeCategory = "all";

    let adminMode = false;

    let selectedItemId = null;

    let addingType = null;

    let dragState = null;

    let resizeState = null;

    let rotateState = null;


    /* ============================================================
       ELEMENTS
    ============================================================ */

    const world =
      document.getElementById("world");

    const emptyMessage =
      document.getElementById("emptyMessage");

    const loginModal =
      document.getElementById("loginModal");

    const addModal =
      document.getElementById("addModal");

    const passwordInput =
      document.getElementById("passwordInput");

    const loginError =
      document.getElementById("loginError");

    const itemTitle =
      document.getElementById("itemTitle");

    const itemCategory =
      document.getElementById("itemCategory");

    const itemContent =
      document.getElementById("itemContent");

    const addModalTitle =
      document.getElementById("addModalTitle");

    const saveStatus =
      document.getElementById("saveStatus");


    /* ============================================================
       UTILS
    ============================================================ */

    function makeId() {
      return (
        Date.now().toString(36) +
        Math.random().toString(36).slice(2)
      );
    }


    function escapeText(value) {
      return String(value ?? "");
    }


    function youtubeId(url) {

      if (!url) return null;

      try {

        const parsed =
          new URL(url.trim());

        if (
          parsed.hostname.includes("youtube.com")
        ) {

          if (
            parsed.pathname === "/watch"
          ) {
            return parsed.searchParams.get("v");
          }

          if (
            parsed.pathname.startsWith("/shorts/")
          ) {
            return parsed.pathname
              .split("/")[2];
          }

          if (
            parsed.pathname.startsWith("/embed/")
          ) {
            return parsed.pathname
              .split("/")[2];
          }
        }

        if (
          parsed.hostname === "youtu.be"
        ) {
          return parsed.pathname
            .slice(1)
            .split("?")[0];
        }

      } catch (error) {
        return null;
      }

      return null;
    }


    function categoryForType(type) {

      if (type === "text") {
        return "writing";
      }

      if (type === "note") {
        return "archive";
      }

      if (type === "image") {
        return "image";
      }

      if (type === "video") {
        return "video";
      }

      return "archive";
    }


    function defaultSize(type) {

      if (type === "image") {
        return {
          width: 360,
          height: 260
        };
      }

      if (type === "video") {
        return {
          width: 480,
          height: 300
        };
      }

      if (type === "note") {
        return {
          width: 280,
          height: 180
        };
      }

      return {
        width: 280,
        height: 150
      };
    }


    function setStatus(text) {
      saveStatus.textContent = text;
    }


    /* ============================================================
       LOAD
    ============================================================ */

    async function loadItems() {

      setStatus("loading...");

      const {
        data,
        error
      } = await supabaseClient
        .from("canvas_items")
        .select("*")
        .order("z_index", {
          ascending: true
        });

      if (error) {

        console.error(error);

        setStatus("database error");

        alert(
          "Supabase에서 작품을 불러오지 못했습니다.\n\n" +
          error.message
        );

        return;
      }

      items = (data || []).map(item => ({
        id: item.id,
        type: item.type,
        content: item.content || "",
        title: item.title || "",
        category:
          item.category ||
          categoryForType(item.type),

        x: Number(item.x ?? 0),
        y: Number(item.y ?? 0),

        width: Number(item.width ?? 200),
        height: Number(item.height ?? 150),

        z_index: Number(item.z_index ?? 1),

        rotation:
          Number(item.rotation ?? 0)
      }));

      render();

      setStatus("ready");
    }


    /* ============================================================
       RENDER
    ============================================================ */

    function render() {

      world.innerHTML = "";

      const visibleItems =
        items.filter(item => {

          if (
            activeCategory === "all"
          ) {
            return true;
          }

          return (
            item.category === activeCategory
          );
        });

      emptyMessage.style.display =
        visibleItems.length === 0
          ? "block"
          : "none";

      visibleItems.forEach(item => {

        const el =
          createItemElement(item);

        world.appendChild(el);

      });
    }


    function createItemElement(item) {

      const el =
        document.createElement("div");

      el.className = "item";

      if (
        selectedItemId === item.id
      ) {
        el.classList.add("selected");
      }

      el.dataset.id = item.id;

      el.style.left =
        `${item.x}px`;

      el.style.top =
        `${item.y}px`;

      el.style.width =
        `${item.width}px`;

      el.style.height =
        `${item.height}px`;

      el.style.zIndex =
        String(item.z_index || 1);

      el.style.transform =
        `rotate(${item.rotation || 0}deg)`;


      const inner =
        document.createElement("div");

      inner.className =
        "item-inner";


      /* TEXT */

      if (item.type === "text") {

        const text =
          document.createElement("div");

        text.className =
          "item-text";

        text.textContent =
          escapeText(item.content);

        inner.appendChild(text);
      }


      /* NOTE */

      else if (item.type === "note") {

        const note =
          document.createElement("div");

        note.className =
          "item-note";

        note.textContent =
          escapeText(item.content);

        inner.appendChild(note);
      }


      /* IMAGE */

      else if (item.type === "image") {

        const image =
          document.createElement("img");

        image.className =
          "item-image";

        image.src =
          item.content;

        image.alt =
          item.title || "image";

        image.draggable = false;

        image.onerror = () => {
          image.style.opacity = "0.25";
        };

        inner.appendChild(image);
      }


      /* VIDEO */

      else if (item.type === "video") {

        const videoId =
          youtubeId(item.content);

        if (videoId) {

          const iframe =
            document.createElement("iframe");

          iframe.className =
            "video-frame";

          iframe.src =
            `https://www.youtube.com/embed/${videoId}`;

          iframe.allow =
            "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";

          iframe.allowFullscreen =
            true;

          inner.appendChild(iframe);

        } else {

          const error =
            document.createElement("div");

          error.className =
            "item-note";

          error.textContent =
            "Invalid YouTube URL";

          inner.appendChild(error);
        }
      }


      el.appendChild(inner);


      /* ADMIN CONTROLS */

      const resize =
        document.createElement("div");

      resize.className =
        "resize-handle";

      el.appendChild(resize);


      const rotateLine =
        document.createElement("div");

      rotateLine.className =
        "rotate-line";

      el.appendChild(rotateLine);


      const rotate =
        document.createElement("div");

      rotate.className =
        "rotate-handle";

      el.appendChild(rotate);


      const deleteButton =
        document.createElement("button");

      deleteButton.className =
        "delete-button";

      deleteButton.textContent =
        "×";

      el.appendChild(deleteButton);


      /* EVENTS */

      el.addEventListener(
        "pointerdown",
        event => {

          if (!adminMode) {
            return;
          }

          if (
            event.target === resize ||
            event.target === rotate ||
            event.target === deleteButton
          ) {
            return;
          }

          selectItem(item.id);

          startDrag(
            event,
            item,
            el
          );
        }
      );


      resize.addEventListener(
        "pointerdown",
        event => {

          if (!adminMode) {
            return;
          }

          event.stopPropagation();

          selectItem(item.id);

          startResize(
            event,
            item
          );
        }
      );


      rotate.addEventListener(
        "pointerdown",
        event => {

          if (!adminMode) {
            return;
          }

          event.stopPropagation();

          selectItem(item.id);

          startRotate(
            event,
            item,
            el
          );
        }
      );


      deleteButton.addEventListener(
        "click",
        async event => {

          event.stopPropagation();

          await deleteItem(item.id);
        }
      );


      return el;
    }


    /* ============================================================
       SELECT
    ============================================================ */

    function selectItem(id) {

      selectedItemId = id;

      render();
    }


    /* ============================================================
       DRAG
    ============================================================ */

    function startDrag(
      event,
      item,
      element
    ) {

      event.preventDefault();

      element.setPointerCapture(
        event.pointerId
      );

      dragState = {

        id: item.id,

        pointerId:
          event.pointerId,

        startX:
          event.clientX,

        startY:
          event.clientY,

        originalX:
          item.x,

        originalY:
          item.y,

        element
      };

      element.addEventListener(
        "pointermove",
        handleDrag
      );

      element.addEventListener(
        "pointerup",
        stopDrag,
        {
          once: true
        }
      );
    }


    function handleDrag(event) {

      if (!dragState) {
        return;
      }

      const item =
        items.find(
          i =>
            i.id === dragState.id
        );

      if (!item) {
        return;
      }

      const dx =
        event.clientX -
        dragState.startX;

      const dy =
        event.clientY -
        dragState.startY;

      item.x =
        dragState.originalX + dx;

      item.y =
        dragState.originalY + dy;

      dragState.element.style.left =
        `${item.x}px`;

      dragState.element.style.top =
        `${item.y}px`;
    }


    function stopDrag(event) {

      if (!dragState) {
        return;
      }

      const element =
        dragState.element;

      element.removeEventListener(
        "pointermove",
        handleDrag
      );

      dragState = null;
    }


    /* ============================================================
       RESIZE
    ============================================================ */

    function startResize(
      event,
      item
    ) {

      event.preventDefault();

      resizeState = {

        id: item.id,

        startX:
          event.clientX,

        startY:
          event.clientY,

        originalWidth:
          item.width,

        originalHeight:
          item.height
      };

      window.addEventListener(
        "pointermove",
        handleResize
      );

      window.addEventListener(
        "pointerup",
        stopResize,
        {
          once: true
        }
      );
    }


    function handleResize(event) {

      if (!resizeState) {
        return;
      }

      const item =
        items.find(
          i =>
            i.id === resizeState.id
        );

      if (!item) {
        return;
      }

      const dx =
        event.clientX -
        resizeState.startX;

      const dy =
        event.clientY -
        resizeState.startY;

      item.width =
        Math.max(
          50,
          resizeState.originalWidth + dx
        );

      item.height =
        Math.max(
          40,
          resizeState.originalHeight + dy
        );

      render();
    }


    function stopResize() {

      window.removeEventListener(
        "pointermove",
        handleResize
      );

      resizeState = null;
    }


    /* ============================================================
       ROTATE
    ============================================================ */

    function startRotate(
      event,
      item,
      element
    ) {

      event.preventDefault();

      const rect =
        element.getBoundingClientRect();

      const centerX =
        rect.left +
        rect.width / 2;

      const centerY =
        rect.top +
        rect.height / 2;

      const startAngle =
        Math.atan2(
          event.clientY - centerY,
          event.clientX - centerX
        ) *
        180 /
        Math.PI;

      rotateState = {

        id: item.id,

        centerX,
        centerY,

        startAngle,

        originalRotation:
          item.rotation || 0
      };

      window.addEventListener(
        "pointermove",
        handleRotate
      );

      window.addEventListener(
        "pointerup",
        stopRotate,
        {
          once: true
        }
      );
    }


    function handleRotate(event) {

      if (!rotateState) {
        return;
      }

      const item =
        items.find(
          i =>
            i.id === rotateState.id
        );

      if (!item) {
        return;
      }

      const currentAngle =
        Math.atan2(
          event.clientY -
            rotateState.centerY,

          event.clientX -
            rotateState.centerX
        ) *
        180 /
        Math.PI;

      const difference =
        currentAngle -
        rotateState.startAngle;

      item.rotation =
        rotateState.originalRotation +
        difference;

      render();
    }


    function stopRotate() {

      window.removeEventListener(
        "pointermove",
        handleRotate
      );

      rotateState = null;
    }


    /* ============================================================
       ADD ITEM
    ============================================================ */

    function openAddModal(type) {

      addingType = type;

      itemTitle.value = "";

      itemContent.value = "";

      itemCategory.value =
        categoryForType(type);

      if (type === "text") {

        addModalTitle.textContent =
          "add text";

        itemContent.placeholder =
          "write something...";
      }

      else if (type === "note") {

        addModalTitle.textContent =
          "add note";

        itemContent.placeholder =
          "write a note...";
      }

      else if (type === "image") {

        addModalTitle.textContent =
          "add image";

        itemContent.placeholder =
          "paste image URL...";
      }

      else if (type === "video") {

        addModalTitle.textContent =
          "add video";

        itemContent.placeholder =
          "paste YouTube URL...";
      }

      addModal.classList.add("show");

      setTimeout(() => {
        itemContent.focus();
      }, 100);
    }


    function closeAddModal() {

      addModal.classList.remove("show");

      addingType = null;
    }


    async function createNewItem() {

      if (!addingType) {
        return;
      }

      const content =
        itemContent.value.trim();

      if (!content) {

        alert(
          "내용을 입력해주세요."
        );

        return;
      }

      if (
        addingType === "image"
      ) {

        if (!content.startsWith("http")) {

          alert(
            "이미지 주소(URL)를 넣어주세요."
          );

          return;
        }
      }

      if (
        addingType === "video"
      ) {

        if (!youtubeId(content)) {

          alert(
            "YouTube 주소를 넣어주세요."
          );

          return;
        }
      }

      const size =
        defaultSize(addingType);

      const newItem = {

        id: makeId(),

        type: addingType,

        content,

        title:
          itemTitle.value.trim(),

        category:
          itemCategory.value,

        x:
          Math.max(
            30,
            Math.round(
              Math.random() *
              Math.max(
                100,
                window.innerWidth - size.width - 50
              )
            )
          ),

        y:
          Math.max(
            30,
            Math.round(
              Math.random() *
              Math.max(
                100,
                window.innerHeight - size.height - 120
              )
            )
          ),

        width:
          size.width,

        height:
          size.height,

        z_index:
          getNextZIndex(),

        rotation: 0
      };

      items.push(newItem);

      selectedItemId =
        newItem.id;

      render();

      closeAddModal();

      setStatus("saving...");

      const success =
        await insertItem(newItem);

      if (success) {

        setStatus("saved");

      } else {

        setStatus(
          "save failed"
        );
      }
    }


    function getNextZIndex() {

      if (!items.length) {
        return 1;
      }

      return (
        Math.max(
          ...items.map(
            item =>
              Number(
                item.z_index || 1
              )
          )
        ) + 1
      );
    }


    /* ============================================================
       DATABASE INSERT
    ============================================================ */

    async function insertItem(item) {

      const { error } =
        await supabaseClient
          .from("canvas_items")
          .insert({

            id: item.id,

            type: item.type,

            content: item.content,

            title: item.title,

            category: item.category,

            x: Math.round(item.x),

            y: Math.round(item.y),

            width:
              Math.round(item.width),

            height:
              Math.round(item.height),

            z_index:
              Math.round(item.z_index),

            rotation:
              Number(item.rotation || 0)
          });

      if (error) {

        console.error(error);

        alert(
          "저장하지 못했습니다.\n\n" +
          error.message
        );

        return false;
      }

      return true;
    }


    /* ============================================================
       SAVE ALL
    ============================================================ */

    async function saveAll() {

      if (!adminMode) {
        return;
      }

      setStatus("saving...");

      try {

        for (const item of items) {

          const {
            error
          } =
            await supabaseClient
              .from("canvas_items")
              .update({

                type:
                  item.type,

                content:
                  item.content,

                title:
                  item.title,

                category:
                  item.category,

                x:
                  Math.round(item.x),

                y:
                  Math.round(item.y),

                width:
                  Math.round(item.width),

                height:
                  Math.round(item.height),

                z_index:
                  Math.round(item.z_index),

                rotation:
                  Number(
                    item.rotation || 0
                  )
              })
              .eq(
                "id",
                item.id
              );

          if (error) {
            throw error;
          }
        }

        setStatus("saved");

      } catch (error) {

        console.error(error);

        setStatus("save failed");

        alert(
          "저장에 실패했습니다.\n\n" +
          error.message
        );
      }
    }


    /* ============================================================
       DELETE
    ============================================================ */

    async function deleteItem(id) {

      if (!adminMode) {
        return;
      }

      const ok =
        confirm(
          "이 작품을 삭제할까요?"
        );

      if (!ok) {
        return;
      }

      setStatus("deleting...");

      const {
        error
      } =
        await supabaseClient
          .from("canvas_items")
          .delete()
          .eq(
            "id",
            id
          );

      if (error) {

        console.error(error);

        alert(
          "삭제하지 못했습니다.\n\n" +
          error.message
        );

        setStatus("error");

        return;
      }

      items =
        items.filter(
          item =>
            item.id !== id
        );

      selectedItemId = null;

      render();

      setStatus("deleted");
    }


    /* ============================================================
       CATEGORY
    ============================================================ */

    document
      .querySelectorAll(".category-btn")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            activeCategory =
              button.dataset.category;

            document
              .querySelectorAll(
                ".category-btn"
              )
              .forEach(btn => {
                btn.classList.remove(
                  "active"
                );
              });

            button.classList.add(
              "active"
            );

            selectedItemId = null;

            render();
          }
        );
      });


    /* ============================================================
       LOGIN
    ============================================================ */

    document
      .getElementById("adminOpen")
      .addEventListener(
        "click",
        () => {

          if (adminMode) {

            logout();

            return;
          }

          loginError.style.display =
            "none";

          passwordInput.value = "";

          loginModal.classList.add(
            "show"
          );

          setTimeout(() => {
            passwordInput.focus();
          }, 100);
        }
      );


    document
      .getElementById("cancelLogin")
      .addEventListener(
        "click",
        () => {

          loginModal.classList.remove(
            "show"
          );
        }
      );


    document
      .getElementById("loginButton")
      .addEventListener(
        "click",
        login
      );


    passwordInput
      .addEventListener(
        "keydown",
        event => {

          if (
            event.key === "Enter"
          ) {
            login();
          }
        }
      );


    function login() {

      if (
        passwordInput.value ===
        ADMIN_PASSWORD
      ) {

        adminMode = true;

        document.body.classList.add(
          "admin-mode"
        );

        document.getElementById(
          "adminOpen"
        ).textContent =
          "LOGOUT";

        loginModal.classList.remove(
          "show"
        );

        setStatus("admin");

        render();

      } else {

        loginError.style.display =
          "block";
      }
    }


    function logout() {

      adminMode = false;

      selectedItemId = null;

      document.body.classList.remove(
        "admin-mode"
      );

      document.getElementById(
        "adminOpen"
      ).textContent =
        "ADMIN";

      setStatus("ready");

      render();
    }


    /* ============================================================
       ADMIN BUTTONS
    ============================================================ */

    document
      .getElementById("addText")
      .addEventListener(
        "click",
        () => openAddModal("text")
      );


    document
      .getElementById("addNote")
      .addEventListener(
        "click",
        () => openAddModal("note")
      );


    document
      .getElementById("addImage")
      .addEventListener(
        "click",
        () => openAddModal("image")
      );


    document
      .getElementById("addVideo")
      .addEventListener(
        "click",
        () => openAddModal("video")
      );


    document
      .getElementById("saveAll")
      .addEventListener(
        "click",
        saveAll
      );


    document
      .getElementById("logout")
      .addEventListener(
        "click",
        logout
      );


    document
      .getElementById("cancelAdd")
      .addEventListener(
        "click",
        closeAddModal
      );


    document
      .getElementById("createItem")
      .addEventListener(
        "click",
        createNewItem
      );


    /* ============================================================
       BACKGROUND CLICK
    ============================================================ */

    world.addEventListener(
      "pointerdown",
      event => {

        if (
          event.target === world
        ) {

          selectedItemId = null;

          render();
        }
      }
    );


    /* ============================================================
       START
    ============================================================ */

    loadItems();

  </script>

</body>
</html>
