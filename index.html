<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ddt and apple trees</title>
  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #ffffff;
      font-family: 'Courier New', monospace;
      overflow: hidden;
      user-select: none;
    }

    /* 1. 상단 컨트롤 바 (필터 + 히스토리) */
    .top-bar {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 9999;
      display: flex;
      gap: 10px;
      background: rgba(255, 255, 255, 0.95);
      padding: 8px 12px;
      border: 1px solid #111;
      box-shadow: 2px 2px 0px #111;
    }
    .btn {
      background: none;
      border: 1px solid #ccc;
      padding: 6px 12px;
      font-family: inherit;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn.active, .btn:hover {
      background: #111;
      color: #fff;
      border-color: #111;
    }
    .btn-history {
      background: #f4f4f4;
      border-color: #111;
      font-weight: bold;
    }

    /* 2. 관리자 컨트롤 패널 (Admin 모드일 때만 표시) */
    .admin-panel {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
      display: none; /* 기본 숨김 */
      gap: 8px;
      background: #111;
      color: #fff;
      padding: 8px 12px;
      font-size: 0.75rem;
    }
    .admin-btn {
      background: #fff;
      color: #111;
      border: none;
      padding: 6px 10px;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
    }
    .admin-btn:hover { background: #e63946; color: #fff; }

    /* 3. 무한 백지 도화지 캔버스 */
    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #ffffff;
      transform-origin: center center;
    }

    /* 종이 찢어지는 애니메이션 연출 */
    @keyframes ripCanvas {
      0% {
        clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
        transform: scale(1) rotate(0deg);
        opacity: 1;
      }
      30% {
        clip-path: polygon(0 0, 45% 15%, 55% 85%, 100% 0, 100% 100%, 0 100%);
      }
      70% {
        clip-path: polygon(0 0, 20% 40%, 80% 60%, 100% 10%, 90% 90%, 10% 90%);
        transform: scale(0.85) rotate(-3deg) translateY(50px);
        opacity: 0.7;
      }
      100% {
        clip-path: polygon(0 0, 0 0, 100% 100%, 100% 100%);
        transform: scale(0.6) rotate(12deg) translateY(300px);
        opacity: 0;
      }
    }
    .canvas-ripping {
      animation: ripCanvas 1.2s cubic-bezier(0.55, 0.055, 0.675, 0.19) forwards;
    }

    /* 4. 콜라주 미디어 요소 */
    .draggable {
      position: absolute;
      display: inline-block;
      transition: box-shadow 0.2s;
    }
    body.admin-mode .draggable {
      cursor: grab;
      outline: 1px dashed #aaa;
    }
    body.admin-mode .draggable:active {
      cursor: grabbing;
      outline: 2px solid #111;
    }

    .media-content img {
      display: block;
      max-width: 320px;
      height: auto;
      pointer-events: none;
    }
    .media-content video {
      display: block;
      width: 340px;
      height: auto;
    }
    .audio-box {
      background: #f8f8f8;
      border: 1px solid #111;
      padding: 10px;
      width: 290px;
    }
    .audio-box audio { width: 100%; }

    /* 5. 히스토리 모달 레이어 */
    .history-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(255, 255, 255, 0.96);
      z-index: 10000;
      display: none;
      padding: 40px;
      overflow-y: auto;
    }
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #111;
      padding-bottom: 12px;
      margin-bottom: 30px;
    }
    .history-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    .history-card {
      border: 1px solid #111;
      padding: 16px;
      background: #fff;
      cursor: pointer;
      border-top: 4px solid #111;
      transition: transform 0.2s;
    }
    .history-card:hover {
      transform: translateY(-4px);
      box-shadow: 4px 4px 0px #111;
    }

    .hidden-by-filter { display: none !important; }

    /* 관리자 로그인 아이콘 (우하단 구석) */
    .admin-trigger {
      position: fixed;
      bottom: 10px;
      right: 10px;
      font-size: 0.7rem;
      color: #ddd;
      cursor: pointer;
      z-index: 9999;
    }
  </style>
</head>
<body>

  <!-- 카테고리 필터 & 히스토리 버튼 -->
  <div class="top-bar">
    <button class="btn active" onclick="filterCategory('ALL')">ALL</button>
    <button class="btn" onclick="filterCategory('IMAGE')">IMAGE</button>
    <button class="btn" onclick="filterCategory('VIDEO')">VIDEO</button>
    <button class="btn" onclick="filterCategory('AUDIO')">AUDIO</button>
    <span style="border-left: 1px solid #ccc; margin: 0 4px;"></span>
    <button class="btn btn-history" onclick="toggleHistoryModal(true)">📜 HISTORIES</button>
  </div>

  <!-- 관리자 전용 툴바 -->
  <div class="admin-panel" id="adminPanel">
    <span>[ADMIN MODE]</span>
    <button class="admin-btn" onclick="tearCurrentCanvas()">✂️ 도화지 찢어서 보관</button>
    <button class="admin-btn" onclick="exportJSON()">💾 배치 JSON 다운로드</button>
    <button class="admin-btn" style="background:#888;" onclick="toggleAdminMode(false)">X</button>
  </div>

  <!-- 백지 도화지 캔버스 -->
  <div id="canvas">
    <!-- 콜라주 미디어가 동적으로 그려집니다 -->
  </div>

  <!-- 과거 작품 히스토리 보관함 모달 -->
  <div class="history-modal" id="historyModal">
    <div class="history-header">
      <h2 style="margin:0; font-size:1.2rem;">RIPPED CANVAS HISTORIES</h2>
      <button class="btn" onclick="toggleHistoryModal(false)">CLOSE [X]</button>
    </div>
    <div class="history-grid" id="historyGrid">
      <!-- 찢긴 과거나 작품 세트가 나열됩니다 -->
    </div>
  </div>

  <!-- 우측 하단 관리자 로그인 히든 트리거 -->
  <div class="admin-trigger" onclick="promptAdminLogin()">🔒 Admin</div>

  <script>
    // ==========================================
    // 1. 초기 작품 데이터 (JSON 구조)
    // ==========================================
    // 과거에 찢겨 보관된 콜라주 작품 데이터
    let histories = [
      {
        id: "piece_001",
        title: "Collage #01 — Apple Tree Residuals",
        date: "2026-09-15",
        items: [
          { type: "IMAGE", category: "IMAGE", src: "apple.jpg", fallback: "https://picsum.photos/300/400?grayscale", top: 120, left: 100, zIndex: 1 },
          { type: "AUDIO", category: "AUDIO", src: "track1.mp3", fallback: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3", title: "Track_01_Demo.mp3", top: 380, left: 140, zIndex: 2 }
        ]
      }
    ];

    // 현재 활성화된 도화지 위 콜라주 데이터
    let currentCanvasItems = [
      { id: "m1", type: "IMAGE", category: "IMAGE", src: "apple.jpg", fallback: "https://picsum.photos/300/400?grayscale", top: 100, left: 80, zIndex: 10 },
      { id: "m2", type: "VIDEO", category: "VIDEO", src: "my_video.mp4", fallback: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4", top: 140, left: 450, zIndex: 12 },
      { id: "m3", type: "AUDIO", category: "AUDIO", src: "track1.mp3", fallback: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3", title: "Track_02_Poison.mp3", top: 440, left: 120, zIndex: 15 }
    ];

    let highestZ = 100;
    let isAdmin = false;
    let currentFilter = 'ALL';

    // ==========================================
    // 2. 캔버스 렌더링
    // ==========================================
    function renderCanvas(items) {
      const canvas = document.getElementById('canvas');
      canvas.innerHTML = '';

      items.forEach(item => {
        const el = document.createElement('div');
        el.className = 'draggable';
        el.setAttribute('data-id', item.id);
        el.setAttribute('data-category', item.category);
        el.style.top = `${item.top}px`;
        el.style.left = `${item.left}px`;
        el.style.zIndex = item.zIndex;

        let contentHTML = '';
        if (item.type === 'IMAGE') {
          contentHTML = `<div class="media-content"><img src="${item.src}" onerror="this.src='${item.fallback}'"></div>`;
        } else if (item.type === 'VIDEO') {
          contentHTML = `<div class="media-content"><video controls autoplay muted loop playsinline><source src="${item.src}" type="video/mp4"><source src="${item.fallback}" type="video/mp4"></video></div>`;
        } else if (item.type === 'AUDIO') {
          contentHTML = `<div class="media-content audio-box"><p style="margin:0 0 6px 0; font-size:0.75rem; font-weight:bold;">🎵 ${item.title || 'Audio Track'}</p><audio controls loop><source src="${item.src}" type="audio/mpeg"><source src="${item.fallback}" type="audio/mpeg"></audio></div>`;
        }

        el.innerHTML = contentHTML;
        canvas.appendChild(el);

        if (isAdmin) attachDragEvents(el, item);
      });

      applyFilter();
    }

    // ==========================================
    // 3. 관리자 전용 드래그 기능
    // ==========================================
    function attachDragEvents(element, itemObj) {
      let isDragging = false;
      let startX, startY, initialLeft, initialTop;

      function startDrag(clientX, clientY, target) {
        if (!isAdmin) return;
        if (['AUDIO', 'VIDEO', 'SOURCE'].includes(target.tagName)) {
          element.style.zIndex = ++highestZ;
          itemObj.zIndex = highestZ;
          return;
        }

        isDragging = true;
        element.style.zIndex = ++highestZ;
        itemObj.zIndex = highestZ;

        startX = clientX;
        startY = clientY;
        const rect = element.getBoundingClientRect();
        initialLeft = rect.left;
        initialTop = rect.top;
      }

      function moveDrag(clientX, clientY) {
        if (!isDragging) return;
        const newLeft = initialLeft + (clientX - startX);
        const newTop = initialTop + (clientY - startY);
        element.style.left = `${newLeft}px`;
        element.style.top = `${newTop}px`;
        itemObj.left = newLeft;
        itemObj.top = newTop;
      }

      function endDrag() { isDragging = false; }

      element.addEventListener('mousedown', (e) => {
        startDrag(e.clientX, e.clientY, e.target);
        const onMouseMove = (ev) => moveDrag(ev.clientX, ev.clientY);
        const onMouseUp = () => {
          endDrag();
          document.removeEventListener('mousemove', onMouseMove);
          document.removeEventListener('mouseup', onMouseUp);
        };
        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
      });
    }

    // ==========================================
    // 4. 도화지 찢기 & 히스토리 보관 (Rip & Archive)
    // ==========================================
    function tearCurrentCanvas() {
      if (currentCanvasItems.length === 0) {
        alert("현재 도화지가 비어있습니다.");
        return;
      }

      const canvas = document.getElementById('canvas');
      canvas.classList.add('canvas-ripping');

      setTimeout(() => {
        // 현재 작품을 히스토리로 백업
        const newHistory = {
          id: `piece_${String(histories.length + 1).padStart(3, '0')}`,
          title: `Collage #${String(histories.length + 1).padStart(2, '0')} — Archived`,
          date: new Date().toISOString().slice(0, 10),
          items: JSON.parse(JSON.stringify(currentCanvasItems))
        };
        histories.unshift(newHistory);

        // 도화지 비우기 (새 백지)
        currentCanvasItems = [];
        canvas.classList.remove('canvas-ripping');
        renderCanvas(currentCanvasItems);

        alert("현재 도화지가 찢어져 히스토리에 보관되었습니다.");
      }, 1200);
    }

    // ==========================================
    // 5. 히스토리 모달 관리
    // ==========================================
    function toggleHistoryModal(show) {
      const modal = document.getElementById('historyModal');
      modal.style.display = show ? 'block' : 'none';

      if (show) {
        const grid = document.getElementById('historyGrid');
        grid.innerHTML = '';

        if (histories.length === 0) {
          grid.innerHTML = '<p style="color:#888;">보관된 과거 도화지가 없습니다.</p>';
          return;
        }

        histories.forEach(h => {
          const card = document.createElement('div');
          card.className = 'history-card';
          card.innerHTML = `
            <div style="font-size:0.7rem; color:#888;">${h.date}</div>
            <div style="font-weight:bold; font-size:0.95rem; margin:6px 0;">${h.title}</div>
            <div style="font-size:0.75rem; color:#555;">Elements: ${h.items.length} (Image/Video/Audio)</div>
            <div style="margin-top:10px; font-size:0.7rem; text-decoration:underline;">Click to display on canvas 👁</div>
          `;
          card.onclick = () => {
            renderCanvas(h.items);
            toggleHistoryModal(false);
          };
          grid.appendChild(card);
        });
      }
    }

    // ==========================================
    // 6. 카테고리 필터링 (ALL / IMAGE / VIDEO / AUDIO)
    // ==========================================
    function filterCategory(cat) {
      currentFilter = cat;
      document.querySelectorAll('.top-bar .btn').forEach(btn => {
        if (['ALL','IMAGE','VIDEO','AUDIO'].includes(btn.innerText)) {
          btn.classList.toggle('active', btn.innerText === cat);
        }
      });
      applyFilter();
    }

    function applyFilter() {
      document.querySelectorAll('.draggable').forEach(el => {
        const itemCat = el.getAttribute('data-category');
        if (currentFilter === 'ALL' || itemCat === currentFilter) {
          el.classList.remove('hidden-by-filter');
        } else {
          el.classList.add('hidden-by-filter');
        }
      });
    }

    // ==========================================
    // 7. 관리자 인증 & JSON 내보내기
    // ==========================================
    function promptAdminLogin() {
      const pw = prompt("관리자 비밀번호를 입력하세요 (기본: 1234):");
      if (pw === "1234") {
        toggleAdminMode(true);
      } else if (pw !== null) {
        alert("비밀번호가 올바르지 않습니다.");
      }
    }

    // 단축키 Ctrl + Shift + A 모드 전환
    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.shiftKey && (e.key === 'A' || e.key === 'a')) {
        promptAdminLogin();
      }
    });

    function toggleAdminMode(enable) {
      isAdmin = enable;
      document.body.classList.toggle('admin-mode', enable);
      document.getElementById('adminPanel').style.display = enable ? 'flex' : 'none';
      renderCanvas(currentCanvasItems);
    }

    function exportJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(currentCanvasItems, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "canvas_layout.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    // 페이지 시작 실행
    renderCanvas(currentCanvasItems);
  </script>
</body>
</html>
